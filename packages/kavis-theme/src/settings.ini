[Settings]
gtk-theme-name=Kavis
gtk-icon-theme-name=Kavis
gtk-cursor-theme-name=Kavis-Cursors
gtk-cursor-theme-size=24
gtk-font-name=DejaVu Sans 10
gtk-sound-theme-name=kavis
gtk-enable-event-sounds=1
# Kavis tek temalı: koyu. Bu satır kapatılsa bile görünüm değişmez —
# tema dizinindeki gtk.css de koyu sürümün kopyası. İkisi birlikte,
# açık temanın kazara devreye girmesini imkânsız kılıyor.
gtk-application-prefer-dark-theme=true
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-button-images=0
gtk-menu-images=0
gtk-decoration-layout=:minimize,maximize,close
