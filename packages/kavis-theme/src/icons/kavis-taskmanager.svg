<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Task Manager">
  <!-- Kavis Task Manager (feedback G1): a flat teal column chart, the
       shape Windows 11 uses for the same app. No background plate, no
       gradient — the Kavis icon set draws app glyphs in the accent
       color on transparent so they sit on both the dark panel and the
       light one. Bars are 9 wide with 3 of air between them: at 16 px
       that is a solid 3 px column with a 1 px gap, still four bars. -->
  <g fill="#2DD4BF">
    <rect x="1.5"  y="26" width="9" height="16" rx="2.5"/>
    <rect x="13.5" y="14" width="9" height="28" rx="2.5"/>
    <rect x="25.5" y="20" width="9" height="22" rx="2.5"/>
    <rect x="37.5" y="6"  width="9" height="36" rx="2.5"/>
  </g>
</svg>
