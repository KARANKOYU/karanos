# Kavis — açılış ekranı müzik bitmeden kapanmasın, kapanınca da
# konsol metni görünmesin
#
# DİKKAT — bu drop-in normal açılışta ÇALIŞMAZ (İş 2'de öğrenildi):
# Debian'ın lightdm.service'i `Conflicts=plymouth-quit.service` taşıyor
# ve splash'i kendisi `quit --retain-splash` ile kapatıyor. Bu dosya
# yalnızca lightdm'siz/başarısız açılışların (OnFailure=plymouth-quit,
# kurtarma kipleri) güvenlik ağı. Müzik bekletme asıl olarak lightdm'in
# kendi drop-in'inde: iso includes.chroot
# /etc/systemd/system/lightdm.service.d/kavis.conf
#
# plymouth-quit.service normalde grafik hedefe varılınca splash'i
# kapatıyor. Bölüm 5 madde 4 bunun tersini istiyor: sistem daha erken
# hazır olsa bile splash müzik bitene kadar durmalı.
#
# NEDEN `Wants=` YOK (ilk sürümde vardı, kaldırıldı):
# `Wants=kavis-boot-sound.service` yazılınca ses servisi, kendi
# `WantedBy=sysinit.target` bağlantısından bağımsız olarak plymouth-quit
# tarafından da çekiliyordu. Servis bir sebeple erken başlayamazsa
# plymouth-quit onu O ANDA başlatıyor, yani müzik splash'in sonunda
# başlayıp masaüstüne taşıyordu — ilk VirtualBox testinde bu yaşandı.
#
# Artık yalnızca sıralama söyleniyor. Ses servisi hiç başlamazsa `After=`
# etkisiz kalıyor ve splash normal zamanında kapanıyor: müziksiz ama
# düzgün bir açılış.

[Unit]
After=kavis-boot-sound.service

[Service]
# NEDEN `--retain-splash`:
# Düz `plymouth quit` splash'i kapatıp sanal terminali bırakıyor; altında
# duran çekirdek/systemd metni ortaya çıkıyor ve X başlayana kadar ekranda
# kalıyor. İkinci VirtualBox testinde görülen "splash → konsol metni →
# masaüstü" sırası tam olarak bu boşluk.
#
# `--retain-splash` son kareyi framebuffer'da bırakıyor; konsol metni
# yeniden çizilmiyor ve X doğrudan onun üstüne açılıyor. Ses servisi
# çıkmadan hemen önce splash'i zaten söndürdüğü için ekranda kalan kare
# koyu zemin oluyor — masaüstüne yumuşak bir geçiş.
#
# Boş ExecStart satırı şart: systemd'de bir ExecStart'ı değiştirmek için
# önce listeyi temizlemek gerekiyor.
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
