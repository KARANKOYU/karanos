# Kavis — the boot splash must not close before the music ends, and no
# console text must show once it closes
#
# CAUTION — this drop-in does NOT run on a normal boot (learned in Job
# 2): Debian's lightdm.service carries `Conflicts=plymouth-quit.service`
# and closes the splash itself with `quit --retain-splash`. This file
# is only the safety net for lightdm-less/failed boots
# (OnFailure=plymouth-quit, recovery modes). The music hold lives
# mainly in lightdm's own drop-in: iso includes.chroot
# /etc/systemd/system/lightdm.service.d/kavis.conf
#
# plymouth-quit.service normally closes the splash once the graphical
# target is reached. Section 5 item 4 wants the opposite: even if the
# system is ready earlier, the splash must stay until the music ends.
#
# WHY NO `Wants=` (it was in the first version, removed):
# With `Wants=kavis-boot-sound.service` the sound service was also
# pulled in by plymouth-quit, independent of its own
# `WantedBy=sysinit.target` link. If the service could not start early
# for some reason, plymouth-quit started it AT THAT MOMENT, so the
# music began at the end of the splash and spilled into the desktop —
# this happened in the first VirtualBox test.
#
# Now only ordering is stated. If the sound service never starts,
# `After=` has no effect and the splash closes at its normal time: a
# boot without music, but a clean one.

[Unit]
After=kavis-boot-sound.service

[Service]
# WHY `--retain-splash`:
# A plain `plymouth quit` closes the splash and releases the virtual
# terminal; the kernel/systemd text underneath shows up and stays on
# screen until X starts. The "splash → console text → desktop" sequence
# seen in the second VirtualBox test is exactly this gap.
#
# `--retain-splash` leaves the last frame in the framebuffer; the
# console text is not redrawn and X opens directly on top of it. Since
# the sound service already fades the splash right before it exits,
# the frame left on screen is the dark ground — a soft transition to
# the desktop.
#
# The empty ExecStart line is required: in systemd, changing an
# ExecStart needs the list cleared first.
ExecStart=
ExecStart=-/usr/bin/plymouth quit --retain-splash
