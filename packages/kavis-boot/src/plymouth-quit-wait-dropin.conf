# Kavis — plymouth-quit-wait de müziği beklesin
#
# Bu servis `plymouth --wait` çalıştırıp splash kapanana kadar bekliyor;
# giriş yöneticisi onu bekliyor. Yalnızca SIRALAMA veriyoruz.
#
# DİKKAT: plymouth-quit.service için ayrı bir drop-in var ve orada
# ExecStart değiştiriliyor (`--retain-splash`). Aynı dosyayı ikisine
# birden koyarsak buradaki `plymouth --wait` komutunu da ezer ve servis
# bozulur. Bu yüzden iki ayrı dosya.

[Unit]
After=kavis-boot-sound.service
