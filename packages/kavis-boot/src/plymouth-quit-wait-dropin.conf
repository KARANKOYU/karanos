# Kavis — plymouth-quit-wait waits for the music too
#
# This service runs `plymouth --wait` and waits until the splash closes;
# the display manager waits for it. We only give ORDERING here.
#
# CAUTION: plymouth-quit.service has a separate drop-in where ExecStart
# is changed (`--retain-splash`). Putting the same file on both would
# override the `plymouth --wait` command here too and break the
# service. Hence two separate files.

[Unit]
After=kavis-boot-sound.service
