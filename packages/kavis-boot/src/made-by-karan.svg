<?xml version="1.0" encoding="UTF-8"?>
<!--
  "made by Karan" — the italic text on the boot splash.

  WHY SVG: Plymouth uses bitmap fonts, no italic support. This file is
  converted to PNG with rsvg-convert at package build; no font
  dependency remains at boot.

  Color #8B9BA8 = the dark palette's secondary text color.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="150" viewBox="0 0 800 150">
  <text x="400" y="100"
        text-anchor="middle"
        font-family="DejaVu Sans"
        font-style="italic"
        font-size="72"
        fill="#8B9BA8">made by Karan</text>
</svg>
