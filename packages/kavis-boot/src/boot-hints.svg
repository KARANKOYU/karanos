<?xml version="1.0" encoding="UTF-8"?>
<!--
  The two hint lines at the bottom of the boot splash (madde 30):
    boot.advanced_hint  → "F3 — Advanced menu"
    boot.skip_hint      → "Press space to skip"
  The texts are the English source strings (same style as the gettext
  msgids; Plymouth cannot read .mo at runtime, the text is embedded here
  at build time); the splash is shown in the default language (EN — 2
  Sep 2026 decision); there is no runtime language selection in Plymouth.

  Color #8B9BA8 = secondary text; faint so the hints do not draw attention.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140">
  <text x="450" y="52"
        text-anchor="middle"
        font-family="DejaVu Sans"
        font-size="40"
        fill="#8B9BA8">F3 — Advanced menu</text>
  <text x="450" y="116"
        text-anchor="middle"
        font-family="DejaVu Sans"
        font-size="40"
        fill="#8B9BA8">Press space to skip</text>
</svg>
