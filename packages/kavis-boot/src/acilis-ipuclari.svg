<?xml version="1.0" encoding="UTF-8"?>
<!--
  Açılış ekranının altındaki iki ipucu satırı (madde 30):
    boot.advanced_hint  → "F3 — Advanced menu"
    boot.skip_hint      → "Press space to skip"
  Metinler İngilizce kaynak dizgilerdir (gettext düzeninin msgid'leriyle
  aynı üslup; Plymouth çalışma anında .mo okuyamaz, metin buraya
  derlemede gömülür); splash varsayılan
  dilde (EN — 2 Eyl 2026 kararı) gösteriliyor; Plymouth'ta çalışma
  anında dil seçimi yok.

  Renk #8B9BA8 = ikincil metin; ipuçları dikkat çekmesin diye soluk.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140">
  <text x="450" y="52"
        text-anchor="middle"
        font-family="DejaVu Sans"
        font-size="40"
        fill="#8B9BA8">F3 — Advanced menu</text>
  <text x="450" y="116"
        text-anchor="middle"
        font-family="DejaVu Sans"
        font-size="40"
        fill="#8B9BA8">Press space to skip</text>
</svg>
