# Kavis boot behavior (madde 30).
# The Settings app will manage this file; it can also be edited by hand.
# Values: 1 = on, 0 = off.

# Play the boot music?
PLAY_MUSIC=1

# Should the boot splash wait until the music ends?
# With 0 the music starts in the background and the desktop appears as
# soon as the system is ready (the music may spill into the desktop).
WAIT_FOR_MUSIC=1
