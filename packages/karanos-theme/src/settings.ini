[Settings]
gtk-theme-name=Karan
gtk-icon-theme-name=Karan
gtk-cursor-theme-name=Karan-Cursors
gtk-cursor-theme-size=24
gtk-font-name=DejaVu Sans 10
# Varsayılan görünüm KOYU. Bu satır kapatılınca tema dizinindeki
# gtk.css (açık sürüm) devreye giriyor; ayarlar uygulamasındaki
# "Tema: Açık / Koyu" seçimi 8. aşamada bu değeri değiştirecek.
gtk-application-prefer-dark-theme=true
gtk-enable-animations=true
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-button-images=0
gtk-menu-images=0
gtk-decoration-layout=:minimize,maximize,close
