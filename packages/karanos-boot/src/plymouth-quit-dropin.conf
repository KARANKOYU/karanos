# Karan OS — açılış ekranı müzik bitmeden kapanmasın
#
# plymouth-quit.service normalde grafik hedefe varılınca splash'i
# kapatıyor. Bölüm 5 madde 4 bunun tersini istiyor: sistem daha erken
# hazır olsa bile splash müzik bitene kadar durmalı, müzik yarıda
# kesilmemeli.
#
# karanos-boot-sound.service Type=oneshot; müzik çalıp kısa fade-out'u
# bekleyene kadar "başlıyor" sayılıyor. Buradaki After+Wants sayesinde
# plymouth-quit onu bekliyor.
#
# Ses servisi başarısız olursa da (aygıt yok, dosya yok) servis yine
# sonlanıyor ve açılış devam ediyor — kendi içinde 10 saniyelik üst
# sınırı var.

[Unit]
After=karanos-boot-sound.service
Wants=karanos-boot-sound.service
