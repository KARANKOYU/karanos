# Kavis — module blacklist (item 8)
#
# algif_*: the AF_ALG socket family of the kernel crypto API. No
# legitimate desktop software uses it; it has been the source of local
# privilege escalation holes in the past. `blacklist` prevents automatic
# loading, `install ... /bin/false` also blocks loading on request
# (modprobe).
blacklist algif_aead
blacklist algif_hash
blacklist algif_rng
blacklist algif_skcipher
install algif_aead /bin/false
install algif_hash /bin/false
install algif_rng /bin/false
install algif_skcipher /bin/false
