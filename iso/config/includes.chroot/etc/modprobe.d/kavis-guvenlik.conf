# Kavis — modül kara listesi (madde 8)
#
# algif_*: çekirdek kripto API'sinin AF_ALG soket ailesi. Masaüstünde
# kullanan meşru yazılım yok; geçmişte yerel ayrıcalık yükseltme
# açıklarının kaynağı oldu. `blacklist` otomatik yüklemeyi engeller,
# `install ... /bin/false` istekle (modprobe) yüklemeyi de kapatır.
blacklist algif_aead
blacklist algif_hash
blacklist algif_rng
blacklist algif_skcipher
install algif_aead /bin/false
install algif_hash /bin/false
install algif_rng /bin/false
install algif_skcipher /bin/false
