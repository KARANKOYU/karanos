# Kavis (item 52): NetworkManager hands DNS to systemd-resolved instead
# of writing /etc/resolv.conf itself.
#
# Without this the "encrypted DNS" setting has no effect: NetworkManager
# would put the network's own servers straight into resolv.conf and
# resolved's drop-in would never be consulted. With it, resolved is the
# single resolver and the drop-in written by /usr/lib/kavis/set-dns
# decides where queries actually go.
[main]
dns=systemd-resolved
