# Kavis — çekirdek sertleştirme (madde 8)
#
# NEDEN BU DÖRDÜ: hepsi "saldırı yüzeyini daralt, masaüstünü bozma"
# dengesinde. Değerler görev listesinde açıkça verilmiş.

# Ayrıcalıksız kullanıcı ad alanları kapalı. Debian çekirdeğine özgü
# anahtar. DİKKAT (durum.md'de kayıtlı): Flatpak/bubblewrap ve Steam
# pressure-vessel ayrıcalıksız userns ister; madde 41/13 gelince bu
# değer yeniden değerlendirilecek (setuid bwrap ya da değeri açmak).
kernel.unprivileged_userns_clone = 0

# Çekirdek işaretçileri /proc'ta herkese sıfır görünür (root dahil
# yalnız CAP_SYSLOG görür) — KASLR'ı sızdırmamak için.
kernel.kptr_restrict = 2

# dmesg yalnız root'a: çekirdek günlüğü adres/donanım bilgisi sızdırır.
kernel.dmesg_restrict = 1

# ptrace yalnız ebeveyn sürece: bir süreç, kendi başlatmadığı süreci
# izleyemez (hırsız süreç başka sürecin belleğini okuyamaz).
kernel.yama.ptrace_scope = 1
