# Kavis — kernel hardening (item 8)
#
# WHY THESE FOUR: all of them sit on the "narrow the attack surface, do
# not break the desktop" balance. The values are given explicitly in the
# task list.

# Unprivileged user namespaces off. Debian-kernel-specific key.
# DECISION (durum.md, 2026-09-01): in Group G this value WILL BE 1 —
# Flatpak/bubblewrap and Steam pressure-vessel want userns. In return
# AppArmor, /tmp noexec, narrow Flatpak permissions, kavis-* service
# hardening and security-only unattended-upgrades will come.
kernel.unprivileged_userns_clone = 0

# Kernel pointers in /proc read as zero for everyone (only CAP_SYSLOG
# sees them, root included) — so as not to leak KASLR.
kernel.kptr_restrict = 2

# dmesg for root only: the kernel log leaks address/hardware information.
kernel.dmesg_restrict = 1

# ptrace only to the parent process: a process cannot trace a process it
# did not start itself (a rogue process cannot read another's memory).
kernel.yama.ptrace_scope = 1
