# Kavis — kompozitör ayarları (madde 2 + madde 4'ün köşe/animasyon kısmı)
#
# Hedef sürüm Debian trixie'deki picom 12.5. Seçimlerin gerekçeleri
# docs/referans/picom.md'de; kısaca:
#   - backend xrender: GPU şart değil, QEMU/VirtualBox'ta güvenli.
#     v12'den beri backend satırı ZORUNLU — silme, picom hiç başlamaz.
#   - yuvarlak köşe ve v12 animasyonları xrender'da çalışıyor; blur
#     ÇALIŞMIYOR (dual_kawase glx ister). Blur madde 38'de, yalnız
#     gerçek GPU tespit edilince açılacak — burada bilerek yok.
#   - Ayarlar'dan değişiklik akışı: bu dosya yeniden yazılır + picom'a
#     SIGUSR1 gönderilir (D-Bus API'si bu seçenekleri kapsamıyor).

backend = "xrender";
vsync = false;

# --- hayalet pencere düzeltmesi (VM'de doğrulanmış hata) --------------
# VirtualBox testinde yeni açılan pencereler boş/siyah çizildi, görev
# çubuğunun sağ bölgesi (saat) görünmedi; `pkill picom` sorunu tamamen
# giderdi. Suçlu damage takibi: picom yalnız "değişti" bildirilen bölgeyi
# yeniden çizer, hesap şaştığında pencere hiç boyanmaz. Kapatınca picom
# her karede ekranın tamamını çizer.
# CPU maliyeti: boşta ~sıfır (çizim yine damage olayıyla tetikleniyor,
# sadece çizilen alan büyüyor); pencere hareketi/video oynarken xrender
# tam ekran kopyalar yaptığı için belirgin artış — VM'de doğruluk >
# hız. GPU'lu gerçek donanımda geri açmayı madde 38 değerlendirir.
use-damage = false;

# Tam ekran pencerede kompozitörü atlamak (oyunlara bedava hız) aynı
# hataya karışabildiği için kapalı: unredirect'e girip çıkarken ekran
# yeniden çizilmiyordu. Maliyeti yalnız tam ekran senaryosunda karede
# bir fazladan kopya; oyun tarafı madde 13'te GPU'yla birlikte ele
# alınacak.
unredir-if-possible = false;

# --- gölge -----------------------------------------------------------
# Gölge yalnızca üstte duran küçük yüzeylerde: menüler, popup'lar.
# Her pencereye gölge vermek hem yavaş hem görsel olarak gürültülü.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-color = "#000000";

shadow-exclude = [
  "class_g = 'kavis-panel'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DOCK'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'"
];

# --- yuvarlak köşe (madde 4) -----------------------------------------
# xrender'da köşe maskesi önbelleğiyle çiziliyor, GPU istemez.
# Panel, masaüstü ve tam ekran pencereler köşesiz kalır — panel düz
# kenarlı bir şerit, tam ekranda ise köşe kırpması içerik kaybettirir.
corner-radius = 8;
rounded-corners-exclude = [
  "class_g = 'kavis-panel'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "fullscreen"
];

# --- animasyonlar (madde 4: 150-200 ms) ------------------------------
# v12 animasyon sistemi; arka uçtan bağımsız. Yalnız aç/kapa/gizle
# tetikleyicileri kullanılıyor — `geometry` tetikleyicisi deneysel ve
# pencere sürüklerken de çalışıp rahatsız ediyor (referans incelemesi).
# NOT: v12 öncesi picom bu bloğu tanımaz ve uyarı basıp yok sayar;
# yerel test ortamı (Ubuntu, picom 10) bu yüzden animasyonsuz çizer.
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.95; duration = 0.15; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.95; duration = 0.15; }
);

# Saydamlık kullanmıyoruz; pencereler tam opak.
detect-client-opacity = true;
detect-rounded-corners = true;
