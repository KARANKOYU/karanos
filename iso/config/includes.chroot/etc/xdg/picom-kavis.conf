# Kavis — kompozitör ayarları
#
# Amaç sade: gölge ve yuvarlatılmış köşeler çizilebilsin. Bulanıklık,
# saydamlık ve animasyon YOK — boşta RAM hedefi 1 GB (bölüm 20) ve
# sanal makinelerde 3B hızlandırma olmayabilir.

backend = "xrender";
vsync = false;

# Gölge yalnızca üstte duran küçük yüzeylerde: menüler, popup'lar.
# Her pencereye gölge vermek hem yavaş hem görsel olarak gürültülü.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-color = "#000000";

shadow-exclude = [
  "class_g = 'kavis-panel'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DOCK'",
  "_NET_WM_WINDOW_TYPE@:a *= 'DESKTOP'"
];

# Saydamlık kullanmıyoruz; pencereler tam opak.
detect-client-opacity = true;
detect-rounded-corners = true;
