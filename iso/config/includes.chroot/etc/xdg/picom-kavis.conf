# Kavis — compositor settings (item 2 + the corner/animation part of item 4)
#
# Target version is picom 12.5 in Debian trixie. Rationale for the
# choices is in docs/referans/picom.md; in short:
#   - backend xrender: no GPU required, safe in QEMU/VirtualBox.
#     Since v12 the backend line is MANDATORY — do not delete it, picom
#     will not start at all.
#   - rounded corners and the v12 animations work on xrender; blur does
#     NOT (dual_kawase wants glx). Blur is in item 38, to be enabled only
#     when a real GPU is detected — deliberately absent here.
#   - Change flow from Settings: this file is rewritten + SIGUSR1 is sent
#     to picom (the D-Bus API does not cover these options).

backend = "xrender";
vsync = false;

# --- ghost window fix (bug verified in a VM) --------------------------
# In the VirtualBox test newly opened windows were drawn empty/black and
# the taskbar's right area (clock) did not show; `pkill picom` fixed it
# completely. The culprit is damage tracking: picom repaints only the
# region reported as "changed", and when the bookkeeping goes wrong the
# window is never painted. With it off, picom draws the whole screen
# every frame.
# CPU cost: ~zero when idle (drawing is still triggered by damage
# events, only the drawn area grows); a noticeable increase while moving
# windows/playing video since xrender does full-screen copies —
# correctness > speed in a VM. Re-enabling on real hardware with a GPU is
# considered in item 38.
use-damage = false;

# Bypassing the compositor for full-screen windows (free speed for games)
# is off because it could get mixed up in the same bug: the screen was
# not redrawn when entering/leaving unredirect. The cost is only one
# extra copy per frame in the full-screen scenario; the gaming side is
# handled in item 13 together with the GPU.
unredir-if-possible = false;

# --- shadow ----------------------------------------------------------
# Shadow only on small surfaces that sit on top: menus, popups. Giving
# every window a shadow is both slow and visually noisy.
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.45;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-color = "#000000";

# Exclusions are in the `rules` block below (v12 window rules; when rules
# became necessary for the C6 popup animation the old *-exclude lists
# moved there — with the rule system on, picom ignores the old exclusion
# options).

# --- rounded corners (item 4) ----------------------------------------
# On xrender drawn with a cached corner mask, no GPU needed.
# The panel, the desktop and full-screen windows stay square — the panel
# is a straight-edged strip, and on full screen corner clipping loses
# content.
corner-radius = 8;

# --- animations (item 4: 150-200 ms) ---------------------------------
# The v12 animation system; backend-independent. Only the
# open/close/hide triggers are used — the `geometry` trigger is
# experimental and also fires while dragging windows, which is annoying
# (reference review).
# NOTE: pre-v12 picom does not know this block, prints a warning and
# ignores it; the local test environment (Ubuntu, picom 10) therefore
# draws without animations.
# Design language (test8 J2): open 180 ms, close 120 ms; "slide up" does
# not exist among the v12 presets — appear's scale+fade is the closest
# match (docs/tasarim-dili.md).
animations = (
  { triggers = [ "open", "show" ];  preset = "appear";    scale = 0.96; duration = 0.18; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; scale = 0.96; duration = 0.12; }
);

# --- window rules (v12) -----------------------------------------------
# Order matters: matching rules stack, the last writer wins.
#   1-3: shadow/corner exclusions (exact equivalent of the old
#        shadow-exclude + rounded-corners-exclude lists).
#   4:   the Settings > Appearance "Popup animation" choice (test2 C6)
#        for the panel popups (start menu, quick settings, notifications,
#        calendar — all override-redirect kavis-panel windows). This
#        group is rewritten by Settings; do not delete the boundary
#        comments. Default "slide up": slide-in/out, direction by panel
#        position.
rules = (
  { match = "class_g = 'kavis-panel'"; shadow = false; corner-radius = 0; },
  { match = "window_type = 'dock' || window_type = 'desktop'"; shadow = false; corner-radius = 0; },
  { match = "fullscreen"; corner-radius = 0; },
  # popup-animation-begin
  { match = "class_g = 'kavis-panel' && override_redirect";
    animations = (
      { triggers = [ "open", "show" ];  preset = "slide-in";  direction = "up";   duration = 0.18; },
      { triggers = [ "close", "hide" ]; preset = "slide-out"; direction = "down"; duration = 0.12; }
    );
  }
  # popup-animation-end
);

# We do not use transparency; windows are fully opaque.
detect-client-opacity = true;
detect-rounded-corners = true;
