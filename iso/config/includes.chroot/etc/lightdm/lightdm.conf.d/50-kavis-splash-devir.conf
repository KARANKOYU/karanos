# Kavis — lightdm splash'i devralabilsin (İş 2, açılış deneyimi)
#
# lightdm, Plymouth'u yalnızca Plymouth'un VT'si `minimum-vt`den küçük
# DEĞİLSE devralıyor. Plymouth VT1'de çalışıyor, lightdm'in varsayılanı
# minimum-vt=7 — bu yüzden lightdm günlüğe "Plymouth is running on VT 1,
# but this is less than the configured minimum of 7 so not replacing it"
# yazıp splash'i --retain-splash OLMADAN öldürüyor ve X'i VT7'de
# açıyordu: splash → konsol metni → VT değişimi → masaüstü.
#
# minimum-vt=1 ile lightdm X'i Plymouth'un VT'sinde (tty1) başlatır ve
# splash'i `quit --retain-splash` ile kapatır: son kare ekranda kalır,
# konsol hiç görünmez. (getty@tty1 çakışması lightdm.service.d/kavis.conf
# drop-in'inde çözülüyor.)
#
# Bu dosya kurulu sisteme de taşınmalı — 60-kavis-live.conf'un aksine
# Calamares bunu SİLMEZ; davranış canlı/kurulu ayrımı olmadan geçerli.

[LightDM]
minimum-vt=1

# X köku siyaha boyamasın: -background none, framebuffer'daki son
# görüntüyü (retain edilen splash karesini) ilk istemci çizene kadar
# korur. Bu olmadan X başladığı anda ekran siyah köke düşüyor ve
# masaüstü çizilene kadar (KVM'siz QEMU'da 4+ sn, gerçek donanımda 1-2
# sn) siyah kalıyordu — v0.3-test2 ölçümünde görüldü. lightdm kendi
# argümanlarını (vt, -seat, -auth) bu komutun sonuna ekler.
[Seat:*]
xserver-command=X -background none
