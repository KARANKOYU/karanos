# Kavis — let lightdm take over the splash (Task 2, boot experience)
#
# lightdm takes over Plymouth only if Plymouth's VT is NOT below
# `minimum-vt`. Plymouth runs on VT1, lightdm's default is minimum-vt=7 —
# so lightdm logged "Plymouth is running on VT 1, but this is less than
# the configured minimum of 7 so not replacing it", killed the splash
# WITHOUT --retain-splash and started X on VT7: splash → console text →
# VT switch → desktop.
#
# With minimum-vt=1 lightdm starts X on Plymouth's VT (tty1) and closes
# the splash with `quit --retain-splash`: the last frame stays on screen,
# the console never shows. (The getty@tty1 conflict is resolved in the
# lightdm.service.d/kavis.conf drop-in.)
#
# This file must be carried to the installed system too — unlike
# 60-kavis-live.conf, Calamares does NOT delete it; the behaviour applies
# regardless of live/installed.

[LightDM]
minimum-vt=1

# X must not paint the root black: -background none keeps the last image
# in the framebuffer (the retained splash frame) until the first client
# draws. Without it the screen dropped to a black root the moment X
# started and stayed black until the desktop was drawn (4+ s in QEMU
# without KVM, 1-2 s on real hardware) — seen in the v0.3-test2
# measurement. lightdm appends its own arguments (vt, -seat, -auth) to
# the end of this command.
[Seat:*]
xserver-command=X -background none
