# Kavis — live session autologin
#
# TEMPORARY: this file stays only during stages 1–4, until our own login
# screen (kavis-greeter, stage 5) is written.
# On the installed system Calamares deletes this file (stage 11), because
# there is no user `karan` there and the real login screen must show.

[Seat:*]
autologin-user=karan
autologin-user-timeout=0
autologin-session=openbox
user-session=openbox
greeter-session=lightdm-gtk-greeter
