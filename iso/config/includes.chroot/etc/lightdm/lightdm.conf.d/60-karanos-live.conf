# Karan OS — canlı (live) oturum otomatik girişi
#
# GEÇİCİ: Bu dosya yalnızca 1.–4. aşamalarda, kendi giriş ekranımız
# (karanos-greeter, 5. aşama) yazılana kadar duruyor.
# Kurulan sistemde Calamares bu dosyayı siler (11. aşama), çünkü orada
# `karan` diye bir kullanıcı yoktur ve gerçek giriş ekranı gösterilmelidir.

[Seat:*]
autologin-user=karan
autologin-user-timeout=0
autologin-session=openbox
user-session=openbox
greeter-session=lightdm-gtk-greeter
