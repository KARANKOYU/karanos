# Kavis — lightdm sıralaması (İş 2, açılış deneyimi)
#
# 1) Müzik bitmeden splash devralınmasın.
#    Debian'ın lightdm.service'i `Conflicts=plymouth-quit.service`
#    taşıyor: lightdm başlarken plymouth-quit'i (bizim `--retain-splash`
#    drop-in'imizle birlikte) İPTAL EDİYOR ve Plymouth'u kendisi
#    kapatıyor. Yani kavis-boot'un plymouth-quit üstündeki "müziği bekle"
#    sıralaması normal açılışta hiç işlemiyordu (SPLASH-TIMING'de
#    quit=0.0s bundandı). Bekleme şartı artık doğrudan lightdm'e
#    söyleniyor: müzik (kavis-boot-sound, oneshot) bitmeden lightdm
#    başlamaz. Servis yoksa/koşulu tutmazsa (splash parametresiz açılış)
#    After= etkisizdir, gecikme olmaz.
#
# 2) X, Plymouth'un VT'sinde (tty1) başlıyor (lightdm.conf.d'deki
#    minimum-vt=1). getty@tty1 aynı VT'ye giriş istemi basmasın — GDM'in
#    kendi biriminde yaptığı çözümün aynısı.

[Unit]
After=kavis-boot-sound.service
Conflicts=getty@tty1.service
After=getty@tty1.service
