# Kavis — lightdm ordering (Task 2, boot experience)
#
# 1) The splash must not be taken over before the music ends.
#    Debian's lightdm.service carries `Conflicts=plymouth-quit.service`:
#    while starting, lightdm CANCELS plymouth-quit (together with our
#    `--retain-splash` drop-in) and closes Plymouth itself. So
#    kavis-boot's "wait for the music" ordering on plymouth-quit never
#    applied in a normal boot (that is why SPLASH-TIMING showed
#    quit=0.0s). The wait condition is now told to lightdm directly:
#    lightdm does not start before the music (kavis-boot-sound, oneshot)
#    ends. If the service is absent or its condition fails (boot without
#    the splash parameter) After= has no effect, there is no delay.
#
# 2) X starts on Plymouth's VT (tty1) (minimum-vt=1 in lightdm.conf.d).
#    getty@tty1 must not print a login prompt on the same VT — the same
#    solution GDM applies in its own unit.

[Unit]
After=kavis-boot-sound.service
Conflicts=getty@tty1.service
After=getty@tty1.service
