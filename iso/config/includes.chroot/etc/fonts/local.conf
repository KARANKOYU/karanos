<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Kavis — system font rendering (v0.4-test4 feedback A1).

  The VM round called the text "pixelated". Two causes, both fixed here:

  1. No fontconfig policy at all, so every application fell back to
     whatever the freetype build defaults to. On Debian that is full
     hinting, which snaps stems to the pixel grid and makes a modern
     UI face look like a bitmap font. Slight hinting keeps the shapes
     the designer drew and lets antialiasing do the rest — the same
     choice GNOME and KDE ship.
  2. Subpixel rendering was never turned on. rgb + the default LCD
     filter triples the horizontal resolution on an LCD panel, which
     is where the "crisp" look comes from.

  The UI face is Inter: a screen face with a tall x-height, drawn for
  exactly this size range. Noto Sans is the fallback for scripts Inter
  does not cover, DejaVu the last resort so a missing package can
  never leave the system without a sans face.

  This file only sets policy. The size (10pt) is in the toolkit
  settings: kavis-theme settings.ini for GTK, Xresources for Xft/Qt,
  the openbox rc.xml font blocks for title bars.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <!-- Autohint off: Inter and Noto ship good hinting instructions and
         the autohinter overrides them with worse ones. -->
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Generic families.

       WHY prepend AND NOT <alias><prefer>: Debian's own
       /etc/fonts/conf.d/60-latin.conf has already built the preference
       list for sans-serif by the time local.conf is read, and <prefer>
       appends to the END of that list — so DejaVu still won and the
       whole point of the change was lost. A strong prepend on the
       pattern puts our face at the front, and the rest of the list
       stays as the fallback chain.

       Fallback order after Inter: Noto Sans covers the scripts Inter
       does not (Kavis is meant to be translated, so a missing-glyph box
       is a real failure), DejaVu is the last resort so a missing
       package can never leave the system without a sans face. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
      <string>Noto Sans</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <!-- openbox writes "sans" into rc.xml, CSS asks for "system-ui", and
       GTK asks for the family named in settings.ini; all reach Inter. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
      <string>Noto Sans Mono</string>
    </edit>
  </match>

  <!-- Emoji: the colour font must win for emoji codepoints in every
       family, or the picker draws boxes. -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
