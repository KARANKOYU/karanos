# Kavis — touchpad hareket eşlemeleri (sonraki-isler 6g)
# Biçim: <yön><parmak>=<xdotool tuşu>   (yön: up/down/left/right)
# Kullanıcı ~/.config/kavis/gestures.conf ile ezebilir.
#
# X11 sınırı (bilinçli kabul): hareket → kısayol simülasyonu; akıcı
# animasyon değil, tuş kısayolu hissi. Wayland'de yeniden bakılır.
up3=super+Tab
down3=super+d
left3=ctrl+alt+Right
right3=ctrl+alt+Left
left4=ctrl+alt+Right
right4=ctrl+alt+Left
