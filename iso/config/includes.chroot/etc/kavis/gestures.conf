# Kavis — touchpad gesture mappings (next-tasks 6g)
# Format: <direction><fingers>=<xdotool key>   (direction: up/down/left/right)
# The user can override with ~/.config/kavis/gestures.conf.
#
# X11 limit (accepted knowingly): gesture → shortcut simulation; not a
# fluid animation, it feels like a key shortcut. Revisited on Wayland.
up3=super+Tab
down3=super+d
left3=ctrl+alt+Right
right3=ctrl+alt+Left
left4=ctrl+alt+Right
right4=ctrl+alt+Left
