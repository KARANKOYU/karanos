# Kavis — vendor name in a window title → the name Kavis uses (D1).
#
# Renaming an application in its .desktop file (etc/kavis/applications/)
# changes the menu and the taskbar, but not the title bar: that text is
# written by the application itself into _NET_WM_NAME. kavis-snap reads
# this file and rewrites every title that still carries the vendor name,
# so "notes.txt - Mousepad" reads "notes.txt - Notepad".
#
# One "vendor=kavis" per line. Whole words only, so a file named
# mousepad.txt keeps its name. Keep this in step with the Name= fields
# in /etc/kavis/applications/*.desktop — tools/check-config.sh checks
# that every name here is one an override actually renamed.

Mousepad=Notepad
Tilix=Terminal
Nemo=Files
