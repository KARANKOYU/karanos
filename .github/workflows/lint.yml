name: Quick checks

# Runs in under a minute on every push. Purpose: stop a typo/syntax error
# from reaching the 40-minute ISO build.

on:
  push:
  pull_request:

# So the "Translation status" step can commit to the README (main only).
permissions:
  contents: write

jobs:
  check:
    name: Syntax and package names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck xz-utils python3-yaml gettext

      - name: Configuration check
        run: |
          chmod +x tools/*.sh
          tools/check-config.sh

      - name: Do the package names exist in the Debian trixie archive
        run: tools/check-packages.sh

      - name: shellcheck
        run: |
          shellcheck -S warning \
            tools/*.sh \
            iso/auto/config iso/auto/build iso/auto/clean \
            iso/config/hooks/normal/*.hook.* \
            iso/config/includes.chroot/usr/lib/kavis/boot-check

      # The "Translation status" table in the README is refreshed on every
      # run; if it changed, it is written to main with a [skip ci] commit.
      # Does not run on PRs and branches (needs write access to main).
      - name: Test coverage table (item 72)
        run: |
          set -eu
          # Generated file: the run fails when it is stale, and when a
          # FINISHED group has an item nothing tests. Items whose group
          # has not been built yet are listed as waiting, not as gaps —
          # counting future work as a failure is how a report becomes
          # noise nobody reads.
          python3 tools/gen-test-coverage.py --check
          # The shortcut scenario is generated from the keybind hook, so
          # adding a shortcut without regenerating it is a red run.
          python3 tools/gen-keybind-scenario.py --check

      - name: Translation status table (README)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tools/i18n-stats.sh po /tmp/i18n-stats.json
          python3 tools/gen-translation-table.py /tmp/i18n-stats.json
          if git diff --quiet README.md; then
            echo "Table up to date, no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh translation status table [skip ci]"
          git push
