name: Hızlı kontroller

# Her push'ta 1 dakikadan kısa sürede çalışır. Amaç: yazım/sözdizimi
# hatasının 40 dakikalık ISO derlemesine kadar gitmesini engellemek.

on:
  push:
  pull_request:

jobs:
  check:
    name: Sözdizimi ve paket adları
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli araçlar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck xz-utils python3-yaml

      - name: Yapılandırma kontrolü
        run: |
          chmod +x tools/*.sh
          tools/check-config.sh

      - name: Paket adları Debian trixie arşivinde var mı
        run: tools/check-packages.sh

      - name: shellcheck
        run: |
          shellcheck -S warning \
            tools/*.sh \
            iso/auto/config iso/auto/build iso/auto/clean \
            iso/config/hooks/normal/*.hook.chroot \
            iso/config/includes.chroot/usr/lib/karanos/boot-check
