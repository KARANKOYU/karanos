name: Hızlı kontroller

# Her push'ta 1 dakikadan kısa sürede çalışır. Amaç: yazım/sözdizimi
# hatasının 40 dakikalık ISO derlemesine kadar gitmesini engellemek.

on:
  push:
  pull_request:

# "Çeviri durumu" adımı README'ye commit atabilsin diye (yalnız main).
permissions:
  contents: write

jobs:
  check:
    name: Sözdizimi ve paket adları
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Gerekli araçlar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck xz-utils python3-yaml gettext

      - name: Yapılandırma kontrolü
        run: |
          chmod +x tools/*.sh
          tools/check-config.sh

      - name: Paket adları Debian trixie arşivinde var mı
        run: tools/check-packages.sh

      - name: shellcheck
        run: |
          shellcheck -S warning \
            tools/*.sh \
            iso/auto/config iso/auto/build iso/auto/clean \
            iso/config/hooks/normal/*.hook.* \
            iso/config/includes.chroot/usr/lib/kavis/boot-check

      # README'deki "Çeviri durumu" tablosu her koşuda tazelenir;
      # değişiklik varsa [skip ci] commit'iyle main'e yazılır.
      # PR'larda ve dallarda çalışmaz (main'e yazma yetkisi gerekir).
      - name: Çeviri durumu tablosu (README)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tools/i18n-stats.sh po /tmp/i18n-stats.json
          python3 tools/gen-ceviri-tablosu.py /tmp/i18n-stats.json
          if git diff --quiet README.md; then
            echo "Tablo güncel, commit gerekmez."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: çeviri durumu tablosu güncellendi [skip ci]"
          git push
