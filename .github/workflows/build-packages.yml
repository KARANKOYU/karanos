name: Paketleri derle

# packages/ altındaki kavis-* .deb'lerini derler ve yapıt olarak yükler.
# ISO iş akışı bu iş akışını `uses:` ile çağırıp yapıtı doğrudan
# live-build'in config/packages.chroot/ dizinine koyuyor — böylece ISO'ya
# giren .deb ile burada test edilen .deb aynı koşunun ürünü oluyor.
#
# 13. aşamada bunların yerini aptly ile üretilen gerçek APT deposu alacak.

# TETİKLEYİCİLER (madde 22): push tetiklemesi kaldırıldı — kota. Paketler
# zaten her ISO derlemesinde bu iş akışı üzerinden derlenip doğrulanıyor;
# tek başına denemek için Actions sekmesinden elle çalıştırılabilir.
# Push'ta koşan tek şey hızlı kontroller (lint.yml).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: .deb üret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - name: Derleme bağımlılıkları
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot \
            librsvg2-bin x11-apps python3 ca-certificates git \
            ffmpeg fonts-dejavu-core \
            python3-gi gir1.2-gtk-3.0 gir1.2-wnck-3.0 python3-xlib

      - uses: actions/checkout@v7

      - name: Derle
        run: |
          set -eux
          chmod +x tools/build-packages.sh
          tools/build-packages.sh

      # Paketin içine gerçekten girmesi gerekenler girdi mi? Boş bir imleç
      # dizini ya da eksik duvar kağıdı derlemeyi durdurmaz, sessizce
      # eksik bir tema üretir — burada yakalanır.
      - name: Paket içeriği doğrulaması
        run: |
          set -eu
          deb=out/packages/kavis-theme_*_all.deb
          liste=$(dpkg-deb -c $deb)
          hata=0
          gerek() {
            adet=$(printf '%s\n' "$liste" | grep -c -- "$1" || true)
            if [ "$adet" -lt "$2" ]; then
              echo "::error::kavis-theme içinde '$1' $2 bekleniyordu, $adet var"
              hata=1
            else
              echo "✓ $1 — $adet"
            fi
          }
          gerek "usr/share/themes/Kavis/gtk-3.0/gtk.css"          1
          gerek "usr/share/themes/Kavis/openbox-3/themerc"        1
          gerek "usr/share/icons/Kavis-Cursors/cursors/left_ptr"  1
          gerek "usr/share/icons/Kavis-Cursors/cursors/"          80
          gerek "usr/share/icons/Kavis/48x48/apps/kavis.png"    1
          gerek "usr/share/backgrounds/kavis/kavis.png"         1
          gerek "usr/share/kavis/logo/koyu-k-logo.svg"          1
          gerek "usr/share/kavis/logo/acik-k-logo.svg"          1
          gerek "usr/share/kavis/logo/grub-arkaplan.png"        1
          gerek "usr/lib/os-release"                              1

          deb=out/packages/kavis-boot_*_all.deb
          liste=$(dpkg-deb -c $deb)
          gerek "usr/share/plymouth/themes/kavis/kavis.script"     1
          gerek "usr/share/plymouth/themes/kavis/logo.png"           1
          gerek "usr/share/plymouth/themes/kavis/urun-adi.png"       1
          gerek "usr/share/plymouth/themes/kavis/acilis-ipuclari.png" 1
          gerek "usr/share/plymouth/themes/kavis/made-by-karan.png"  1
          gerek "usr/share/kavis/boot/boot-sound.wav"                1
          gerek "etc/kavis/boot.conf"                                1
          gerek "lib/systemd/system/kavis-boot-sound.service"        1
          gerek "plymouth-quit.service.d/kavis.conf"                 1

          # Muzik gercekten cozulup fade uygulanmis mi? Bozuk bir WAV
          # acilista sessiz kalir ve sebebi ISO acilmadan anlasilmaz.
          rm -rf kb && mkdir kb && dpkg-deb -x $deb kb
          sure=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            kb/usr/share/kavis/boot/boot-sound.wav 2>/dev/null || echo 0)
          echo "acilis muzigi: ${sure}s"
          if awk -v s="$sure" 'BEGIN{exit !(s > 1 && s < 30)}'; then
            echo "✓ muzik suresi makul"
          else
            echo "::error::boot-sound.wav suresi ${sure}s — cozulme basarisiz olmus olabilir"
            hata=1
          fi

          exit $hata

      # Panel saf Python; sözdizimi hatası ya da eksik bir gi modülü
      # .deb derlemesini durdurmuyor, ISO'da sessizce çöküyor ve sebebi
      # ancak QEMU koşusundan sonra görülüyor. Modülleri burada, ekran
      # gerektirmeden içe aktarıp o sınıfı hatayı 10 saniyede yakalıyoruz.
      # (Gtk.Window() ekran ister ama `import` istemiyor.)
      - name: kavis-panel içe aktarılabiliyor mu
        run: |
          set -eu
          rm -rf kp && mkdir kp
          dpkg-deb -x out/packages/kavis-panel_*_all.deb kp
          PYTHONPATH=kp/usr/lib/python3/dist-packages python3 - <<'PY'
          import kavis_panel.panel as panel
          import kavis_panel.baslat as baslat
          import kavis_panel.gosterge as gosterge
          import kavis_panel.guc as guc
          import kavis_panel.uygulamalar as uygulamalar
          import kavis_panel.metinler as metinler
          import kavis_panel.marka as marka
          # Metin tablosundaki anahtarlar gerçekten karşılık veriyor mu:
          # M() eksik anahtarda anahtarın kendisini döndürüyor, o yüzden
          # sessizce "panel.start" yazan bir düğme çıkabilir.
          eksik = [a for a in metinler.METINLER if metinler.M(a) == a]
          assert not eksik, f"karsiligi olmayan anahtar: {eksik}"
          assert panel.YUKSEKLIK > 0
          assert baslat.GENISLIK > 0
          assert callable(guc.kapat) and callable(gosterge.Saat)
          assert uygulamalar.KATEGORI_SIRASI
          # Ürün kimliği: ekransız makinede de ad dönmeli ve logo seçimi
          # koyu logoya düşmeli (tek tema koyu).
          assert marka.urun_adi()
          assert marka.logo_yolu().endswith("koyu-k-logo.svg")
          print("kavis-panel modulleri yuklendi, metin tablosu tutarli")
          PY

      - name: Boyut özeti
        run: |
          set -eu
          {
            echo "### Paketler"
            echo ""
            echo "| Paket | Boyut |"
            echo "|---|---|"
            for f in out/packages/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: kavis-packages
          path: out/packages/*.deb
          retention-days: 14
