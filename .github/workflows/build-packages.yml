name: Build packages

# Builds the kavis-* .deb files under packages/ and uploads them as an
# artifact. The ISO workflow calls this workflow with `uses:` and drops
# the artifact straight into live-build's config/packages.chroot/ — so
# the .deb that goes into the ISO and the .deb tested here come from the
# same run.
#
# Stage 13 will replace these with a real APT repository built with aptly.

# TRIGGERS (item 22): the push trigger was removed — quota. The packages
# are built and verified through this workflow on every ISO build anyway;
# to try them alone, run manually from the Actions tab.
# The only thing that runs on push is the quick checks (lint.yml).
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build .deb
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: debian:trixie
    steps:
      - name: Build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev fakeroot \
            librsvg2-bin x11-apps python3 ca-certificates git \
            ffmpeg fonts-dejavu-core gettext locales \
            valac libgtk-3-dev libwnck-3-dev libx11-dev libxss-dev \
            libpam0g-dev libgstreamer1.0-dev libxtst-dev
          # gettext: msgfmt in rules + check-i18n (Group D task c).
          # locales/en_US: the xx screenshot step needs a real locale
          # (gettext is disabled under C — seen in the Codespace).
          echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen

      - uses: actions/checkout@v7

      - name: Build
        run: |
          set -eux
          chmod +x tools/build-packages.sh
          tools/build-packages.sh

      # Did the things that really must be in the package get in? An empty
      # cursor directory or a missing wallpaper does not stop the build,
      # it silently produces an incomplete theme — caught here.
      - name: Package content verification
        run: |
          set -eu
          deb=out/packages/kavis-theme_*_all.deb
          list=$(dpkg-deb -c $deb)
          fail=0
          need() {
            count=$(printf '%s\n' "$list" | grep -c -- "$1" || true)
            if [ "$count" -lt "$2" ]; then
              echo "::error::expected $2 of '$1' in kavis-theme, found $count"
              fail=1
            else
              echo "✓ $1 — $count"
            fi
          }
          need "usr/share/themes/Kavis/gtk-3.0/gtk.css"          1
          need "usr/share/themes/Kavis/openbox-3/themerc"        1
          need "usr/share/icons/Kavis-Cursors/cursors/left_ptr"  1
          need "usr/share/icons/Kavis-Cursors/cursors/"          80
          need "usr/share/icons/Kavis/48x48/apps/kavis.png"    1
          need "usr/share/icons/Kavis/scalable/apps/kavis-taskmanager.svg" 1
          need "usr/share/icons/Kavis/24x24/apps/kavis-taskmanager.png"    1
          need "usr/share/backgrounds/kavis/kavis.png"         1
          need "usr/share/kavis/logo/koyu-k-logo.svg"          1
          need "usr/share/kavis/logo/acik-k-logo.svg"          1
          need "usr/share/kavis/logo/grub-background.png"      1
          need "usr/lib/os-release"                              1

          deb=out/packages/kavis-boot_*_all.deb
          list=$(dpkg-deb -c $deb)
          need "usr/share/plymouth/themes/kavis/kavis.script"     1
          need "usr/share/plymouth/themes/kavis/logo.png"           1
          need "usr/share/plymouth/themes/kavis/product-name.png"   1
          need "usr/share/plymouth/themes/kavis/boot-hints.png"     1
          need "usr/share/plymouth/themes/kavis/made-by-karan.png"  1
          need "usr/share/kavis/boot/boot-sound.wav"                1
          need "etc/kavis/boot.conf"                                1
          need "lib/systemd/system/kavis-boot-sound.service"        1
          need "plymouth-quit.service.d/kavis.conf"                 1

          # Was the music really decoded and faded? A broken WAV stays
          # silent at boot and the cause is invisible until the ISO boots.
          rm -rf kb && mkdir kb && dpkg-deb -x $deb kb
          duration=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            kb/usr/share/kavis/boot/boot-sound.wav 2>/dev/null || echo 0)
          echo "boot music: ${duration}s"
          if awk -v s="$duration" 'BEGIN{exit !(s > 1 && s < 30)}'; then
            echo "✓ music duration plausible"
          else
            echo "::error::boot-sound.wav duration ${duration}s — decoding may have failed"
            fail=1
          fi

          # The sample rate is checked too (boot-sound work, Group D):
          # rules converts to 44100; a different value means the
          # conversion step changed or was skipped.
          rate=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=sample_rate \
            -of default=noprint_wrappers=1:nokey=1 \
            kb/usr/share/kavis/boot/boot-sound.wav 2>/dev/null || echo 0)
          echo "sample rate: ${rate} Hz"
          if [ "$rate" = "44100" ]; then
            echo "✓ sample rate 44100"
          else
            echo "::error::boot-sound.wav sample rate ${rate} — expected 44100"
            fail=1
          fi

          exit $fail

      # The panel is now a compiled Vala binary (item 3): build errors are
      # already caught at the .deb stage. gettext replaced the string
      # table (Group D task c): the check is on po/ —
      # tools/check-i18n.sh (pot freshness, tr.po completeness,
      # msgfmt --check, xx.po sync).
      - name: kavis-panel binary and translations
        run: |
          set -eu
          # check-i18n → gen-pot uses `git ls-files` (the only reliable
          # way to leave the copied files out). The container runs as
          # root, the repo belongs to another user → git refuses with
          # "dubious ownership" (the cause of the v0.3-test7 red).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf kp && mkdir kp
          dpkg-deb -x out/packages/kavis-panel_*.deb kp
          test -x kp/usr/bin/kavis-panel
          test -f kp/usr/share/applications/kavis-panel.desktop
          test -f kp/usr/share/locale/tr/LC_MESSAGES/kavis.mo
          test -f kp/usr/share/locale/xx/LC_MESSAGES/kavis.mo
          tools/check-i18n.sh
          echo "kavis-panel binary works, translations consistent"

      # Pseudo-long language (xx) screenshot: untranslated text SHOWS as
      # plain English, overflowing layouts as clipped ⟪…⟫. Uploaded as an
      # artifact for manual inspection (no automatic pixel assertion —
      # layout changes must not break the test).
      - name: xx pseudo-language panel screenshot
        run: |
          set -eu
          # Container is debian:trixie and root — no sudo, none needed.
          # test8 I4 lesson: `dpkg -i || apt -f install` could "fix" things
          # by REMOVING the package. test10 lesson: dpkg -i does not
          # resolve dependencies either — the step broke when the panel's
          # Depends grew (kavis-theme, librsvg2-common, alsa-utils). Local
          # .deb files are handed to apt: it resolves dependencies from
          # the archive itself, the step goes RED if it cannot, no removal risk.
          export DEBIAN_FRONTEND=noninteractive
          # x11-utils = xprop (the KEYBIND step relies on these too; all
          # here, NOT in the ISO package list — CI tooling only).
          apt-get install -y -qq --no-install-recommends \
            xvfb openbox dbus dbus-x11 x11-xserver-utils x11-utils \
            xdotool xterm > /dev/null
          apt-get install -y -qq --no-install-recommends \
            ./out/packages/kavis-theme_*.deb \
            ./out/packages/kavis-panel_*.deb > /dev/null
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 1
          openbox & sleep 1
          xsetroot -solid '#3a6b8a'
          # 4A: EN run first — writes the Start LABEL width to stderr
          # (start-width=NN); compared with the xx run.
          dbus-run-session -- sh -c '
            LANG=en_US.UTF-8 LANGUAGE=en kavis-panel 2> panel-en.log &
            sleep 4
            pgrep -x kavis-panel > /dev/null || {
              echo "::error::kavis-panel (EN) is not running"
              cat panel-en.log; exit 1
            }
          '
          pkill -x kavis-panel || true
          sleep 1
          dbus-run-session -- sh -c '
            LANG=en_US.UTF-8 LANGUAGE=xx kavis-panel 2> panel-xx.log &
            sleep 4
            pgrep -x kavis-panel > /dev/null || {
              echo "::error::kavis-panel is not running"; cat panel-xx.log
              exit 1
            }
            ffmpeg -loglevel quiet -f x11grab -video_size 1280x800 \
              -i :99 -frames:v 1 -y panel-xx.ppm
          '
          # 4A check: the xx pseudo-language lengthens text ~2x — if the
          # button did not grow at least 30% over EN, text is being
          # clipped somewhere. A layout tweak must not break the test:
          # WARN, not FAIL.
          en_w=$(grep -o 'start-width=[0-9]*' panel-en.log \
                 | tail -1 | cut -d= -f2)
          xx_w=$(grep -o 'start-width=[0-9]*' panel-xx.log \
                 | tail -1 | cut -d= -f2)
          xx_cut=$(grep -o 'start-clipped=[0-9]' panel-xx.log | tail -1 | cut -d= -f2)
          echo "Start label width: EN=${en_w:-?}px xx=${xx_w:-?}px clipped=${xx_cut:-?}"
          # J: '··' is xx padding, not overflow — the measure is Pango's
          # real '…' ellipsizing (start-clipped). Width is info only.
          if [ -z "${xx_cut:-}" ]; then
            echo "::warning::I18N-WIDTH-WARN: start-clipped log line missing"
          elif [ "$xx_cut" = "1" ]; then
            echo "::warning::I18N-WIDTH-WARN: xx Start label clipped with '…' (${xx_w}px, EN ${en_w}px)"
          fi
          python3 tools/screen-not-blank.py panel-xx.ppm || {
            echo "::error::panel-xx frame is blank/pitch black"
            cat panel-xx.log || true
            exit 1
          }
          ffmpeg -loglevel quiet -i panel-xx.ppm -y panel-xx.png
          test -s panel-xx.png
      # C4 (v0.4-test1): every Kavis shortcut is pressed in Xvfb with the
      # real rc.xml + 0210 hook; if the expected action does not happen
      # within 2 s → KEYBIND-FAIL and the step goes red. Table in the job summary.
      - name: KEYBIND — shortcut check
        run: |
          set -eu
          # Tools were installed in the previous step (xvfb, openbox,
          # xdotool, x11-utils, xterm); the script names any missing one on one line.
          DISPLAY_NO=77 tools/check-keybinds.sh /etc/xdg/openbox/rc.xml

      # Debug round (3 Sep): twice snap was believed to "work in Xvfb" and
      # did not work in a real drag. This step does not move the window
      # with xdotool; it presses the title bar and drags the mouse — openbox
      # does the move.
      - name: SNAP — edge snapping check
        run: |
          set -eu
          # Twice on purpose (C1): without a compositor kavis-snap puts
          # the window in its zone immediately, with one it travels
          # there over 180 ms — different code, same four scenarios.
          DISPLAY_NO=78 tools/check-snap.sh
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y -qq --no-install-recommends picom > /dev/null
          DISPLAY_NO=81 SNAP_PICOM=auto tools/check-snap.sh

      # A3: picom's animation scripts are their own config language and a
      # rejected config means the session boots with NO compositor — no
      # corners, no shadows, no animations. This container is trixie, so
      # the picom here is the one the ISO installs.
      # A scenario with a typo in it would otherwise be discovered in a
      # VM, forty minutes after the mistake. --check parses them all and
      # runs nothing.
      - name: SCENARIOS — every selftest scenario parses
        run: |
          set -eu
          dpkg-deb -x out/packages/kavis-selftest_*.deb /tmp/selftest-root
          # No display needed: --check reads files and opens no window.
          /tmp/selftest-root/usr/bin/kavis-selftest --check --scenarios tests/ui

      - name: PICOM — compositor config check
        run: |
          set -eu
          DISPLAY_NO=79 tools/check-picom.sh

      # A5: the two things the VM round complained about that are
      # measurable — which face fontconfig resolves with what rendering
      # policy, and the radius picom actually draws. The font part is
      # what caught <alias><prefer> losing to Debian's 60-latin.conf.
      - name: VISUAL — font, DPI and corner radius
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y -qq --no-install-recommends \
            fontconfig fonts-inter fonts-noto-core \
            python3-pil python3-gi gir1.2-gtk-3.0 > /dev/null
          DISPLAY_NO=80 tools/check-visual.sh

      - name: Upload xx screenshot
        uses: actions/upload-artifact@v7
        with:
          name: panel-xx-screen
          path: panel-xx.png

      - name: Size summary
        run: |
          set -eu
          {
            echo "### Packages"
            echo ""
            echo "| Package | Size |"
            echo "|---|---|"
            for f in out/packages/*.deb; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: kavis-packages
          path: out/packages/*.deb
          retention-days: 14
