name: Build and test ISO

# We will NOT build the ISO locally — a Codespace has 2 cores, the build
# takes 40+ minutes and wants ~15 GB of disk. All building and the QEMU
# test happen here, on GitHub's machine.

# TRIGGERS (item 22): NO build on every push — every commit took 25-40
# minutes and burned the Actions quota. The ISO is built only two ways:
#   1. Manually from the Actions tab (Run workflow)
#   2. When a v* tag is pushed (release)
# The quick checks (lint.yml) keep running on every push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.0-test)"
        required: false
        default: "1.0-dev"
      smoke_test:
        description: "Run the QEMU smoke test"
        type: boolean
        default: true
      release:
        description: "Publish a pre-release when done"
        type: boolean
        default: false
  push:
    tags:
      - "v*"
  # Weekly robustness run (item 72, kararlar.md 9a): build against current
  # trixie + 5 QEMU profiles; if red, the "weekly-issue" job opens an
  # issue automatically. Monday 03:00 UTC.
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

# Target architecture from ONE place (multi-arch rule). The day an arm64
# ISO is wanted, changing the value here (or moving it into a matrix)
# should be enough; auto/config and the package lists follow the
# variable/conditions. The arm64 build is deliberately NOT in CI — quota.
env:
  KAVIS_ARCH: amd64

jobs:
  # ------------------------------------------------------------------
  # So that the .deb going into the ISO and the .deb being tested come
  # from the same run, the packages are called from here rather than
  # from a separate workflow.
  packages:
    name: Packages
    uses: ./.github/workflows/build-packages.yml

  # ------------------------------------------------------------------
  build:
    name: Build ISO
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      # live-build sets up a chroot and uses loop/mount — must be privileged
      options: --privileged
    outputs:
      version: ${{ steps.meta.outputs.version }}
      iso_name: ${{ steps.meta.outputs.iso_name }}
      product: ${{ steps.meta.outputs.product }}
      arch: ${{ steps.meta.outputs.arch }}
    steps:
      - name: Build dependencies
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            dosfstools mtools \
            ca-certificates git curl rsync file sudo
          # Bootloader tools per target architecture (grub-pc is x86 only)
          case "$KAVIS_ARCH" in
            amd64) apt-get install -y --no-install-recommends \
                     grub-pc-bin grub-efi-amd64-bin ;;
            arm64) apt-get install -y --no-install-recommends \
                     grub-efi-arm64-bin ;;
          esac

      - uses: actions/checkout@v7

      - name: Version info
        id: meta
        run: |
          set -eu
          # Product name/id from a single source: the theme package's
          # os-release. The lowercase id (ID) goes into the ISO name,
          # NAME into visible places.
          # CAUTION: os-release also defines its own VERSION="1.0"; so it
          # is sourced FIRST and the run's version is written AFTER —
          # in v0.2-test3 the order was reversed and the ISO name
          # wrongly became 1.0.
          . packages/kavis-theme/src/os-release
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || 'main-dev' }}"
          fi
          echo "version=${VERSION}"                            >> "$GITHUB_OUTPUT"
          echo "iso_name=${ID}-${VERSION}-${KAVIS_ARCH}.iso" >> "$GITHUB_OUTPUT"
          echo "product=${NAME}"                               >> "$GITHUB_OUTPUT"
          echo "arch=${KAVIS_ARCH}"                            >> "$GITHUB_OUTPUT"
          echo "Version: ${NAME} ${VERSION} (${KAVIS_ARCH})"

      # apt package cache (item 22): live-build keeps every .deb it
      # downloads and the debootstrap archive under iso/cache. Keeping it
      # between runs stops unchanged packages from being downloaded again
      # every run. The key depends on the package lists: when the lists
      # change a new cache is written, a partial match (restore-keys)
      # starts from the old one.
      - name: live-build cache
        uses: actions/cache@v4
        with:
          path: iso/cache
          key: lb-cache-${{ hashFiles('iso/config/package-lists/**', 'iso/auto/config') }}
          restore-keys: |
            lb-cache-

      - name: Configure live-build
        working-directory: iso
        env:
          KAVIS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          chmod +x auto/config auto/build auto/clean
          # .hook.chroot and .hook.binary — both must be executable
          chmod +x config/hooks/normal/*.hook.*
          # Do NOT use --purge: it also deletes cache/ and throws away
          # the apt cache restored by actions/cache. In a clean CI
          # workspace there is nothing else purge would delete anyway.
          lb clean || true
          lb config

      # live-build installs the .deb files under config/packages.chroot/
      # into the chroot on its own. Until the APT repository arrives in
      # stage 13, the kavis-* packages enter the ISO this way.
      # CAUTION: downloaded AFTER `lb config` — so the .deb files are not
      # deleted in case lb rebuilds the config tree.
      - name: Download kavis-* packages
        uses: actions/download-artifact@v8
        with:
          name: kavis-packages
          path: iso/config/packages.chroot

      - name: Show the placed packages
        run: ls -lh iso/config/packages.chroot/

      - name: Build ISO
        working-directory: iso
        env:
          KAVIS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          lb build

      - name: Name the ISO and compute its checksum
        id: pack
        working-directory: iso
        run: |
          set -eux
          # The file name comes from --image-name in auto/config
          # (os-release ID); any .hybrid.iso is accepted so as not to
          # depend on the name.
          SRC=$(ls -1 ./*.hybrid.iso 2>/dev/null | head -1)
          mkdir -p ../out
          mv "$SRC" "../out/${{ steps.meta.outputs.iso_name }}"
          cd ../out
          sha256sum "${{ steps.meta.outputs.iso_name }}" \
            > "${{ steps.meta.outputs.iso_name }}.sha256"
          sha256sum "${{ steps.meta.outputs.iso_name }}" > SHA256SUMS
          ls -lh

      # The QEMU test takes 25 minutes. If a bootloader error can be
      # caught in 5 seconds, catch it there: extract the GRUB
      # configuration from inside the ISO and look for the lines we expect.
      - name: In-ISO bootloader verification
        working-directory: out
        run: |
          set -eu
          ISO="${{ steps.meta.outputs.iso_name }}"
          rm -rf grubcheck && mkdir grubcheck
          # Menu entries are in grub.cfg, settings in config.cfg — this
          # split was learned in v0.2-test1; both files are checked.
          xorriso -osirrox on -indev "$ISO" \
            -extract /boot/grub/config.cfg grubcheck/config.cfg \
            -extract /boot/grub/grub.cfg grubcheck/grub.cfg 2>/dev/null
          echo "--- tail of grub.cfg inside the ISO ---"
          tail -25 grubcheck/grub.cfg
          echo "------------------------------------"
          fail=0
          if grep -q '^set timeout=' grubcheck/config.cfg; then
            echo "✓ set timeout present — menu proceeds on its own (B1: hidden, Shift shows it)"
          else
            echo "::error::GRUB config.cfg has NO 'set timeout'. The ISO will hang in the menu."
            fail=1
          fi
          if grep -q 'terminal_output --append serial' grubcheck/config.cfg; then
            echo "✓ serial console present — CI can see the menu"
          else
            echo "::warning::GRUB does not write to the serial console, debugging gets harder"
          fi
          for f in config.cfg grub.cfg; do
            if grub-script-check "grubcheck/$f"; then
              echo "✓ $f GRUB syntax valid"
            else
              echo "::error::$f GRUB syntax INVALID — the menu will never open"
              fail=1
            fi
          done
          # Branding and advanced menu (9600 + 9601): product name from a
          # single source. The step runs with working-directory: out —
          # path relative to the repo root.
          . "$GITHUB_WORKSPACE/packages/kavis-theme/src/os-release"
          branded=$(grep -c "menuentry \"$NAME" grubcheck/grub.cfg || true)
          if [ "$branded" -ge 1 ]; then
            echo "✓ branded entry count: $branded"
          else
            echo "::error::grub.cfg has NO entry named '$NAME' — inspect the 9600 hook"
            fail=1
          fi
          if grep -q '^submenu "Advanced menu (F3)"' grubcheck/grub.cfg; then
            echo "✓ Advanced menu (F3) present"
          else
            echo "::error::Advanced menu (F3) NOT in grub.cfg — inspect the 9601 hook"
            fail=1
          fi
          if grep -q "submenu 'Utilities" grubcheck/grub.cfg; then
            echo "::warning::The stock Utilities submenu is still there"
          fi
          rm -rf grubcheck
          exit $fail

      - name: Size check (limit 1900 MB, kararlar.md 8)
        working-directory: out
        run: |
          set -eu
          BYTES=$(stat -c%s "${{ steps.meta.outputs.iso_name }}")
          MB=$((BYTES / 1024 / 1024))
          # Group G decision 8 (3 Sep): 1536 → 1900 (headroom under the
          # GitHub Release 2 GiB limit); early warning above 1700.
          LIMIT=1900
          WARN=1700
          echo "ISO size: ${MB} MB (limit ${LIMIT} MB)"
          {
            echo "### ISO"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| File | \`${{ steps.meta.outputs.iso_name }}\` |"
            echo "| Size | **${MB} MB** / ${LIMIT} MB |"
            echo "| sha256 | \`$(cut -d' ' -f1 "${{ steps.meta.outputs.iso_name }}.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Item 46A: the size limit is now an ERROR — GitHub release
          # limit and the user's download budget; as a warning, growth
          # accumulated silently.
          if [ "$MB" -gt "$LIMIT" ]; then
            echo "::error::ISO ${MB} MB — ABOVE the ${LIMIT} MB limit"
            exit 1
          elif [ "$MB" -gt "$WARN" ]; then
            echo "::warning::ISO ${MB} MB — exceeded the ${WARN} MB warning threshold (limit ${LIMIT})"
          fi

      - name: Save the package list (for size analysis)
        if: always()
        working-directory: iso
        run: |
          set -eu
          mkdir -p ../out
          if [ -f chroot.packages.live ]; then
            cp chroot.packages.live ../out/package-list.txt
          fi
          cp build.log ../out/build.log 2>/dev/null || true

      - name: Dependency ranges (DEPS-RANGE, item 72)
        # The >= / << bounds in the kavis-* control files are compared
        # with the real versions that went into the ISO; dpkg enforces
        # them at install anyway, but here it is visible which package
        # is up against its bound.
        run: tools/check-deps-range.sh out/package-list.txt

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: kavis-iso
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Upload build log (also on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            iso/build.log
            iso/chroot.packages.live
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  smoke-test:
    name: QEMU ${{ matrix.mode }} (${{ matrix.profile }})
    needs: build
    # The smoke test exists only for amd64 for now (qemu-system-x86 + OVMF).
    # When arm64's day comes a separate path with qemu-system-arm + AAVMF will be written.
    if: >-
      needs.build.outputs.arch == 'amd64' &&
      (github.event_name != 'workflow_dispatch' || inputs.smoke_test)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      # Item 46A: three boot modes with the default profile + two
      # hardware profiles (2 GB/single core and 4 GB/4 cores + virtio
      # display) under UEFI. Profile values are in the case in the
      # "Smoke test" step.
      matrix:
        mode: [bios, uefi, secureboot]
        profile: [default]
        include:
          - mode: uefi
            profile: low
          - mode: uefi
            profile: wide
    container:
      image: debian:trixie
    steps:
      - name: QEMU and OVMF
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf ca-certificates procps coreutils \
            netcat-openbsd python3

      - uses: actions/checkout@v7

      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: kavis-iso
          path: out

      - name: Smoke test
        env:
          # The whole run on an emulated CPU: boot, boot-check and 38
          # selftest scenarios. At 900 the v0.5-test2 run was cut off
          # four scenarios from the end; the job ceiling below leaves
          # room for the longer budget.
          TIMEOUT: 1200
          SERIAL_OUT: ${{ github.workspace }}/diag/serial-${{ matrix.mode }}-${{ matrix.profile }}.log
          SCREENSHOT_DIR: ${{ github.workspace }}/diag
        run: |
          set -eu
          mkdir -p diag
          chmod +x tools/qemu-smoke-test.sh
          # Hardware profiles (item 46A)
          case "${{ matrix.profile }}" in
            low) export RAM_MB=2048 CPUS=1 ;;
            wide) export RAM_MB=4096 CPUS=4 VGA=virtio ;;
            default) : ;;
          esac
          ISO=$(ls out/*.iso | head -1)
          tools/qemu-smoke-test.sh "$ISO" "${{ matrix.mode }}"

      # Item 46A: results as a table in the job summary; if idle RAM
      # exceeds 1 GB → WARNING (in the live session the squashfs RAM
      # overlay makes it higher than an installed system — hence not an error).
      - name: Result summary
        if: always()
        run: |
          set -eu
          serial="diag/serial-${{ matrix.mode }}-${{ matrix.profile }}.log"
          [ -f "$serial" ] || { echo "no serial log"; exit 0; }
          {
            echo "### QEMU ${{ matrix.mode }} (${{ matrix.profile }})"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            grep -o 'KAVIS-CHECK: [A-Z-]*=\?[^\r]*' "$serial" \
              | sed 's/^KAVIS-CHECK: //' \
              | grep -E '^(RESULT|MEM-USED|BOOT-MODE|SECURE-BOOT|FAILED-CHECKS|SPLASH-TIMING|SOUND-DELAY|PANEL-RSS|PANEL-USS|SETTINGS)' \
              | sed 's/^\([A-Z-]*\)=\?/| \1 | /; s/$/ |/' || true
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          mem=$(grep -o 'KAVIS-CHECK: MEM-USED=[0-9]*' "$serial" | grep -o '[0-9]*' | tail -1 || true)
          if [ -n "${mem:-}" ] && [ "$mem" -gt 1024 ]; then
            echo "::warning::Idle RAM ${mem} MB — above the 1 GB target (${{ matrix.mode }}/${{ matrix.profile }})"
          fi

      # If boot fails, diagnosing without a screenshot is hard. The ISO
      # can be downloaded by hand too, but to avoid burning a 40-minute
      # run on guesswork, the log and frames here are looked at first.
      - name: Upload diagnostics (serial log + screenshots)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ matrix.mode }}-${{ matrix.profile }}
          path: diag/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # WHY IT NEVER RAN BEFORE (item 22 review): the job ran only when
  # `github.ref_type == 'tag'` and no v* tag had ever been pushed to the
  # repo — so the step was not broken, it was never triggered.
  # On top of that there was `draft: true`: even with a tag the release
  # would have been created as a draft and not shown on the Releases page.
  # Fix: (1) it also publishes when the "release" box is ticked in a
  # manual run (as a pre-release, with a v<version> tag), (2) draft disabled.
  weekly-issue:
    name: Weekly run red → issue
    needs: [build, smoke-test]
    if: >-
      always() && github.event_name == 'schedule' &&
      (needs.build.result == 'failure' || needs.smoke-test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: diag-*
          path: diag
        continue-on-error: true
      - name: Open an issue or add a comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          SMOKE_RESULT: ${{ needs.smoke-test.result }}
        run: |
          set -eu
          # Title: the broken checks (FAILED-CHECKS from the serial logs);
          # "build" if the build broke.
          broken=$(grep -rh "KAVIS-CHECK: FAILED-CHECKS=" diag 2>/dev/null \
            | sed 's/.*FAILED-CHECKS=//' | tr ' ' '\n' | sort -u | tr '\n' ' ' || true)
          if [ "$BUILD_RESULT" = "failure" ]; then
            broken="build ${broken}"
          fi
          broken=$(printf '%s' "$broken" | sed 's/ *$//')
          [ -n "$broken" ] || broken="unknown"
          title="trixie update broke: ${broken}"
          body="Weekly scheduled run ($(date -u +%Y-%m-%d)) is red.
          - build: ${BUILD_RESULT}
          - QEMU smoke test: ${SMOKE_RESULT}
          - broken checks: ${broken}
          - run: ${RUN_URL}"
          gh label create trixie-weekly --repo "$REPO" --force \
            --description "Weekly trixie run is red" --color B60205
          open_issue=$(gh issue list --repo "$REPO" --label trixie-weekly --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" --body "$body"
            echo "Comment added to open issue #$open_issue."
          else
            gh issue create --repo "$REPO" --label trixie-weekly \
              --title "$title" --body "$body"
          fi

  release:
    name: Upload to Releases
    needs: [build, smoke-test]
    # smoke-test in `needs` can be disabled in a manual run; a skipped
    # dependency would normally skip this job too. So the condition is
    # explicit: build succeeded + smoke test succeeded OR skipped.
    # `v*-test*` tags do NOT produce a release: the Codespace token cannot
    # do workflow_dispatch (403), so pushing a tag is the only autonomous
    # way to start a build+test run — test tags exist for that and must
    # not litter the Releases page.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      ((github.ref_type == 'tag' && !contains(github.ref_name, '-test')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kavis-iso
          path: out

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.product }} ${{ needs.build.outputs.version }}
          # A manual run has no tag; a tag name is derived from the
          # version and attached to that run's commit. On a tag push
          # these two lines have no effect (the existing tag is used).
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            out/*.iso
            out/*.iso.sha256
            out/SHA256SUMS
          body: |
            ## ${{ needs.build.outputs.product }} ${{ needs.build.outputs.version }}

            **File:** `${{ needs.build.outputs.iso_name }}`

            ### Installation
            1. Download the ISO, verify it with `SHA256SUMS`
            2. Write it to a USB stick (balenaEtcher, Rufus or `dd`)
            3. Boot from the USB → try the live system or install

            Verification:
            ```
            sha256sum -c ${{ needs.build.outputs.iso_name }}.sha256
            ```
