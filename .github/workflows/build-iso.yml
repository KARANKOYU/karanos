name: ISO derle ve test et

# Yerelde ISO DERLEMEYECEĞİZ — Codespace 2 çekirdek, derleme 40+ dakika ve
# ~15 GB disk ister. Tüm derleme ve QEMU testi burada, GitHub'ın makinesinde.

# TETİKLEYİCİLER (madde 22): her push'ta derleme YOK — her commit 25-40
# dakika sürüyor ve Actions kotasını yakıyordu. ISO yalnızca iki yolla
# derlenir:
#   1. Actions sekmesinden elle (Run workflow)
#   2. v* etiketi push edilince (yayın)
# Hızlı kontroller (lint.yml) her push'ta koşmaya devam ediyor.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (örn. 1.0-test)"
        required: false
        default: "1.0-dev"
      smoke_test:
        description: "QEMU duman testini çalıştır"
        type: boolean
        default: true
      release:
        description: "Bitince taslak öndeğerlendirme sürümü (pre-release) yayınla"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

# Hedef mimari TEK yerden (çok-mimarili hazırlık kuralı). arm64 ISO'su
# istendiği gün burada değer değiştirmek (veya matrise almak) yetmeli;
# auto/config ve paket listeleri değişkene/koşullara göre davranıyor.
# arm64 derlemesi bilinçli olarak CI'a EKLENMEDİ — kota.
env:
  KAVIS_MIMARI: amd64

jobs:
  # ------------------------------------------------------------------
  # ISO'ya giren .deb ile test edilen .deb aynı koşunun ürünü olsun diye
  # paketleri ayrı bir iş akışından değil, buradan çağırıyoruz.
  packages:
    name: Paketler
    uses: ./.github/workflows/build-packages.yml

  # ------------------------------------------------------------------
  build:
    name: ISO derle
    needs: packages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      # live-build chroot kurar, loop/mount kullanır — ayrıcalıklı olmalı
      options: --privileged
    outputs:
      version: ${{ steps.meta.outputs.version }}
      iso_name: ${{ steps.meta.outputs.iso_name }}
      product: ${{ steps.meta.outputs.product }}
      mimari: ${{ steps.meta.outputs.mimari }}
    steps:
      - name: Derleme bağımlılıkları
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            dosfstools mtools \
            ca-certificates git curl rsync file sudo
          # Önyükleyici araçları hedef mimariye göre (grub-pc yalnız x86)
          case "$KAVIS_MIMARI" in
            amd64) apt-get install -y --no-install-recommends \
                     grub-pc-bin grub-efi-amd64-bin ;;
            arm64) apt-get install -y --no-install-recommends \
                     grub-efi-arm64-bin ;;
          esac

      - uses: actions/checkout@v7

      - name: Sürüm bilgisi
        id: meta
        run: |
          set -eu
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version || 'main-dev' }}"
          fi
          # Ürün adı/kimliği tek kaynaktan: tema paketindeki os-release.
          # ISO adına küçük harfli kimlik (ID), görünen yerlere NAME gider.
          . packages/kavis-theme/src/os-release
          echo "version=${VERSION}"                            >> "$GITHUB_OUTPUT"
          echo "iso_name=${ID}-${VERSION}-${KAVIS_MIMARI}.iso" >> "$GITHUB_OUTPUT"
          echo "product=${NAME}"                               >> "$GITHUB_OUTPUT"
          echo "mimari=${KAVIS_MIMARI}"                        >> "$GITHUB_OUTPUT"
          echo "Sürüm: ${NAME} ${VERSION} (${KAVIS_MIMARI})"

      # apt paket önbelleği (madde 22): live-build indirdiği tüm .deb'leri
      # ve debootstrap arşivini iso/cache altında tutuyor. Bunu koşular
      # arasında saklamak, değişmeyen paketlerin her koşuda yeniden
      # inmesini engelliyor. Anahtar paket listelerine bağlı: listeler
      # değişince yeni önbellek yazılır, kısmi eşleşme (restore-keys)
      # eskisinden başlar.
      - name: live-build önbelleği
        uses: actions/cache@v4
        with:
          path: iso/cache
          key: lb-cache-${{ hashFiles('iso/config/package-lists/**', 'iso/auto/config') }}
          restore-keys: |
            lb-cache-

      - name: live-build yapılandır
        working-directory: iso
        env:
          KAVIS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          chmod +x auto/config auto/build auto/clean
          # .hook.chroot ve .hook.binary — ikisi de çalıştırılabilir olmalı
          chmod +x config/hooks/normal/*.hook.*
          # --purge KULLANMA: cache/ dizinini de siler ve actions/cache ile
          # geri getirilen apt önbelleğini çöpe atar. Temiz CI çalışma
          # alanında purge'un sildiği başka bir şey de yok.
          lb clean || true
          lb config

      # live-build, config/packages.chroot/ altındaki .deb'leri chroot'a
      # kendiliğinden kuruyor. APT deposu 13. aşamada gelene kadar
      # kavis-* paketleri ISO'ya bu yoldan giriyor.
      # DİKKAT: `lb config`ten SONRA indiriliyor — lb'nin config ağacını
      # yeniden kurduğu bir durumda .deb'lerin silinmemesi için.
      - name: kavis-* paketlerini indir
        uses: actions/download-artifact@v8
        with:
          name: kavis-packages
          path: iso/config/packages.chroot

      - name: Yerleşen paketleri göster
        run: ls -lh iso/config/packages.chroot/

      - name: ISO derle
        working-directory: iso
        env:
          KAVIS_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eux
          lb build

      - name: ISO'yu adlandır ve özetini çıkar
        id: pack
        working-directory: iso
        run: |
          set -eux
          # Dosya adı auto/config'deki --image-name'den (os-release ID)
          # gelir; ada bağımlı kalmamak için her .hybrid.iso kabul ediliyor.
          SRC=$(ls -1 ./*.hybrid.iso 2>/dev/null | head -1)
          mkdir -p ../out
          mv "$SRC" "../out/${{ steps.meta.outputs.iso_name }}"
          cd ../out
          sha256sum "${{ steps.meta.outputs.iso_name }}" \
            > "${{ steps.meta.outputs.iso_name }}.sha256"
          sha256sum "${{ steps.meta.outputs.iso_name }}" > SHA256SUMS
          ls -lh

      # QEMU testi 25 dakika sürüyor. Önyükleyici hatasını 5 saniyede
      # yakalayabiliyorsak orada yakalayalım: ISO'nun içindeki GRUB
      # yapılandırmasını çıkarıp beklediğimiz satırlar var mı diye bak.
      - name: ISO içi önyükleyici doğrulaması
        working-directory: out
        run: |
          set -eu
          ISO="${{ steps.meta.outputs.iso_name }}"
          rm -rf grubcheck && mkdir grubcheck
          # Menü girdileri grub.cfg'de, ayarlar config.cfg'de — bu ayrım
          # v0.2-test1'de öğrenildi; iki dosya da denetleniyor.
          xorriso -osirrox on -indev "$ISO" \
            -extract /boot/grub/config.cfg grubcheck/config.cfg \
            -extract /boot/grub/grub.cfg grubcheck/grub.cfg 2>/dev/null
          echo "--- ISO içindeki grub.cfg sonu ---"
          tail -25 grubcheck/grub.cfg
          echo "------------------------------------"
          hata=0
          if grep -q '^set timeout=' grubcheck/config.cfg; then
            echo "✓ set timeout var — menü kendiliğinden açılacak"
          else
            echo "::error::GRUB config.cfg içinde 'set timeout' YOK. ISO menüde takılır."
            hata=1
          fi
          if grep -q 'terminal_output --append serial' grubcheck/config.cfg; then
            echo "✓ seri konsol var — CI menüyü görebilir"
          else
            echo "::warning::GRUB seri konsola yazmıyor, hata ayıklaması zorlaşır"
          fi
          for f in config.cfg grub.cfg; do
            if grub-script-check "grubcheck/$f"; then
              echo "✓ $f GRUB sözdizimi geçerli"
            else
              echo "::error::$f GRUB sözdizimi HATALI — menü hiç açılmaz"
              hata=1
            fi
          done
          # Marka ve gelişmiş menü (9600 + 9601): ürün adı tek kaynaktan
          . packages/kavis-theme/src/os-release
          markali=$(grep -c "menuentry \"$NAME" grubcheck/grub.cfg || true)
          if [ "$markali" -ge 1 ]; then
            echo "✓ markalı girdi sayısı: $markali"
          else
            echo "::error::grub.cfg'de '$NAME' adlı girdi YOK — 9600 hook'u incele"
            hata=1
          fi
          if grep -q '^submenu "Gelişmiş menü (F3)"' grubcheck/grub.cfg; then
            echo "✓ Gelişmiş menü (F3) var"
          else
            echo "::error::Gelişmiş menü (F3) grub.cfg'de YOK — 9601 hook'u incele"
            hata=1
          fi
          if grep -q "submenu 'Utilities" grubcheck/grub.cfg; then
            echo "::warning::İngilizce Utilities alt menüsü hâlâ duruyor"
          fi
          rm -rf grubcheck
          exit $hata

      - name: Boyut kontrolü (hedef 1.5 GB)
        working-directory: out
        run: |
          set -eu
          BYTES=$(stat -c%s "${{ steps.meta.outputs.iso_name }}")
          MB=$((BYTES / 1024 / 1024))
          LIMIT=1536
          echo "ISO boyutu: ${MB} MB (sınır ${LIMIT} MB)"
          {
            echo "### ISO"
            echo ""
            echo "| Alan | Değer |"
            echo "|---|---|"
            echo "| Dosya | \`${{ steps.meta.outputs.iso_name }}\` |"
            echo "| Boyut | **${MB} MB** / ${LIMIT} MB |"
            echo "| sha256 | \`$(cut -d' ' -f1 "${{ steps.meta.outputs.iso_name }}.sha256")\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Madde 46A: boyut sınırı artık HATA — GitHub release sınırı ve
          # kullanıcının indirme bütçesi; uyarı olarak kalınca büyüme
          # sessizce birikiyordu.
          if [ "$MB" -gt "$LIMIT" ]; then
            echo "::error::ISO ${MB} MB — ${LIMIT} MB sınırının ÜSTÜNDE"
            exit 1
          fi

      - name: Paket listesini kaydet (boyut ayıklaması için)
        if: always()
        working-directory: iso
        run: |
          set -eu
          mkdir -p ../out
          if [ -f chroot.packages.live ]; then
            cp chroot.packages.live ../out/paket-listesi.txt
          fi
          cp build.log ../out/build.log 2>/dev/null || true

      - name: ISO'yu yükle
        uses: actions/upload-artifact@v7
        with:
          name: kavis-iso
          path: out/
          retention-days: 14
          compression-level: 0

      - name: Derleme günlüğünü yükle (hata durumunda da)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: |
            iso/build.log
            iso/chroot.packages.live
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  smoke-test:
    name: QEMU ${{ matrix.mode }} (${{ matrix.profil }})
    needs: build
    # Duman testi şimdilik yalnız amd64 için var (qemu-system-x86 + OVMF).
    # arm64 günü geldiğinde qemu-system-arm + AAVMF ile ayrı bir yol yazılacak.
    if: >-
      needs.build.outputs.mimari == 'amd64' &&
      (github.event_name != 'workflow_dispatch' || inputs.smoke_test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # Madde 46A: üç açılış kipi varsayılan profille + iki donanım
      # profili (2 GB/tek çekirdek ve 4 GB/4 çekirdek + virtio ekran)
      # UEFI'de. Profil değerleri "Duman testi" adımındaki case'te.
      matrix:
        mode: [bios, uefi, secureboot]
        profil: [varsayilan]
        include:
          - mode: uefi
            profil: dusuk
          - mode: uefi
            profil: genis
    container:
      image: debian:trixie
    steps:
      - name: QEMU ve OVMF
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf ca-certificates procps coreutils \
            netcat-openbsd python3

      - uses: actions/checkout@v7

      - name: ISO'yu indir
        uses: actions/download-artifact@v8
        with:
          name: kavis-iso
          path: out

      - name: Duman testi
        env:
          TIMEOUT: 900
          SERIAL_OUT: ${{ github.workspace }}/tani/serial-${{ matrix.mode }}-${{ matrix.profil }}.log
          SCREENSHOT_DIR: ${{ github.workspace }}/tani
        run: |
          set -eu
          mkdir -p tani
          chmod +x tools/qemu-smoke-test.sh
          # Donanım profilleri (madde 46A)
          case "${{ matrix.profil }}" in
            dusuk) export RAM_MB=2048 CPUS=1 ;;
            genis) export RAM_MB=4096 CPUS=4 VGA=virtio ;;
            varsayilan) : ;;
          esac
          ISO=$(ls out/*.iso | head -1)
          tools/qemu-smoke-test.sh "$ISO" "${{ matrix.mode }}"

      # Madde 46A: sonuçlar tablo hâlinde job summary'ye; boşta RAM
      # 1 GB'ı aşarsa UYARI (canlı oturumda squashfs RAM overlay'i
      # yüzünden kurulu sistemden yüksek çıkar — bu yüzden hata değil).
      - name: Sonuç özeti
        if: always()
        run: |
          set -eu
          seri="tani/serial-${{ matrix.mode }}-${{ matrix.profil }}.log"
          [ -f "$seri" ] || { echo "seri günlük yok"; exit 0; }
          {
            echo "### QEMU ${{ matrix.mode }} (${{ matrix.profil }})"
            echo ""
            echo "| Kontrol | Sonuç |"
            echo "|---|---|"
            grep -o 'KAVIS-CHECK: [A-Z-]*=\?[^\r]*' "$seri" \
              | sed 's/^KAVIS-CHECK: //' \
              | grep -E '^(RESULT|MEM-USED|BOOT-MODE|SECURE-BOOT|FAILED-CHECKS|SPLASH-TIMING|SOUND-DELAY)' \
              | sed 's/^\([A-Z-]*\)=\?/| \1 | /; s/$/ |/' || true
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          mem=$(grep -o 'KAVIS-CHECK: MEM-USED=[0-9]*' "$seri" | grep -o '[0-9]*' | tail -1 || true)
          if [ -n "${mem:-}" ] && [ "$mem" -gt 1024 ]; then
            echo "::warning::Boşta RAM ${mem} MB — 1 GB hedefinin üstünde (${{ matrix.mode }}/${{ matrix.profil }})"
          fi

      # Boot başarısız olursa ekran görüntüsü olmadan teşhis etmek zor. ISO
      # elle de indirilebiliyor ama 40 dakikalık koşuyu tahminle harcamamak
      # için önce buradaki günlük ve karelere bakılır.
      - name: Teşhis dosyalarını yükle (seri günlük + ekran görüntüsü)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tani-${{ matrix.mode }}-${{ matrix.profil }}
          path: tani/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # NEDEN DAHA ÖNCE HİÇ ÇALIŞMADI (madde 22 incelemesi): iş yalnızca
  # `github.ref_type == 'tag'` iken koşuyordu ve depoya bugüne dek hiç
  # v* etiketi push edilmedi — yani adım hatalı değildi, hiç tetiklenmedi.
  # Üstüne `draft: true` vardı: etiket atılsaydı bile sürüm taslak olarak
  # oluşacak, Releases sayfasında görünmeyecekti.
  # Düzeltme: (1) elle koşuda "release" kutusu işaretlenirse de yayınlanır
  # (pre-release olarak, v<sürüm> etiketiyle), (2) taslak kapatıldı.
  release:
    name: Releases'e yükle
    needs: [build, smoke-test]
    # `needs` içindeki smoke-test elle koşuda kapatılabiliyor; atlanmış
    # bağımlılık normalde bu işi de atlatır. O yüzden koşul açık açık:
    # derleme başarılı + duman testi başarılı YA DA atlanmış olmalı.
    # `v*-test*` etiketleri release ÜRETMEZ: Codespace token'ı
    # workflow_dispatch yapamadığı (403) için derleme+test koşusunu
    # başlatmanın tek otonom yolu etiket push'u — test etiketleri bu iş
    # için var, Releases sayfasını kirletmesin.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (needs.smoke-test.result == 'success' || needs.smoke-test.result == 'skipped') &&
      ((github.ref_type == 'tag' && !contains(github.ref_name, '-test')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kavis-iso
          path: out

      - name: Release oluştur
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ needs.build.outputs.product }} ${{ needs.build.outputs.version }}
          # Elle koşuda etiket yok; sürümden bir etiket adı türetiliyor ve
          # o koşunun commit'ine iliştiriliyor. Etiket push'unda bu iki
          # satır etkisiz (mevcut etiket kullanılır).
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.build.outputs.version) }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          files: |
            out/*.iso
            out/*.iso.sha256
            out/SHA256SUMS
          body: |
            ## ${{ needs.build.outputs.product }} ${{ needs.build.outputs.version }}

            **Dosya:** `${{ needs.build.outputs.iso_name }}`

            ### Kurulum
            1. ISO'yu indir, `SHA256SUMS` ile doğrula
            2. USB'ye yaz (balenaEtcher, Rufus veya `dd`)
            3. USB'den aç → canlı sistemi dene veya kur

            Doğrulama:
            ```
            sha256sum -c ${{ needs.build.outputs.iso_name }}.sha256
            ```
