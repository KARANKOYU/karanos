# Terminal and editors (item 40): the three applications open, under the
# names Kavis gives them.
name: 40-editors
title: Terminal and editors
item: 40
allowed: [tilix, mousepad, kate]
steps:
  - do: launch mousepad
    expect: window mousepad visible
    timeout: 40000
    note: the notepad
    shot: true
  - do: shell xdotool search --class mousepad getwindowname %@ | grep -qi notepad
    expect: ok
    timeout: 10000
    note: >
      the title says Notepad, not Mousepad — the vendor name is
      rewritten by kavis-snap from the title map (D1)
  - do: close window mousepad
    expect: window mousepad absent
    timeout: 8000
  - do: launch tilix
    expect: window tilix visible
    timeout: 40000
  - do: close window tilix
    expect: window tilix absent
    timeout: 8000
