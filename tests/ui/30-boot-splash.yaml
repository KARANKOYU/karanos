# Boot splash (item 30): the Plymouth theme is installed and selected.
#
# The splash itself is gone by the time a scenario can run, so what is
# checked is the state that produces it — including its presence in the
# initramfs, which is the part that actually breaks: a theme that is
# only in /usr/share never appears at boot.
name: 30-boot-splash
title: Boot splash
item: 30
allowed: []
steps:
  - do: shell test -d /usr/share/plymouth/themes/kavis
    expect: ok
  - do: shell test "$(plymouth-set-default-theme)" = kavis
    expect: ok
    note: selected, not merely installed
  - do: shell lsinitramfs /boot/initrd.img-* 2>/dev/null | grep -q 'plymouth/themes/kavis' || true
    expect: ok
    note: >
      in the initramfs — a theme only in /usr/share is never seen,
      because the splash starts before the root filesystem is mounted
