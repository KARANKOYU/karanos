# Network (item 52): the page and the pieces a VM can actually exercise.
#
# QEMU gives a wired connection and no Wi-Fi hardware, so the Wi-Fi
# section is absent by design and the wired one is what gets checked.
# Connecting to a real access point, the hotspot and importing a VPN
# profile stay on the VM checklist by hand — they need hardware and a
# file the test does not have.
name: 52-network
title: Network
item: 52
allowed: [kavis-settings]
steps:
  - do: launch kavis-settings network
    expect: window kavis-settings visible
    timeout: 40000
    note: the page builds from nmcli (wired, VPN, DNS privacy)
    shot: true
  - do: shell test -n "$(nmcli -t -f DEVICE,TYPE,STATE device)"
    expect: ok
    timeout: 10000
    note: >
      NetworkManager is up and enumerating devices. Not "ethernet":
      QEMU's NIC is often brought up by the initramfs and stays
      unmanaged, so asking for a wired device tests the emulator, not
      Kavis
  - do: shell test -x /usr/lib/kavis/set-dns
    expect: ok
  - do: shell grep -q "/run/systemd/system" /usr/lib/kavis/set-dns
    expect: ok
    note: >
      the host guard is still in the shipped script. Checked by reading,
      not by running: as the user the script correctly fails at
      mkdir /etc/systemd/resolved.conf.d, so its exit code says nothing
      about the guard
  - do: shell grep -q "build-marker" /usr/lib/kavis/set-dns
    expect: ok
    note: the second half of the guard — a Kavis system, not any Debian
  - do: shell grep -q systemd-resolved /etc/NetworkManager/conf.d/10-kavis-dns.conf
    expect: ok
    note: without this NetworkManager writes resolv.conf itself and encrypted DNS does nothing
  - do: shell systemctl is-active --quiet systemd-resolved
    expect: ok
    timeout: 10000
    note: the resolver the DNS setting configures is actually running
  - do: close window kavis-settings
    expect: window kavis-settings absent
    timeout: 8000
