# Açılış (madde 0/2/30 — GRUB gizli, splash, ses, autologin, /users/karan)
name: 01-acilis
title: Açılış
madde: 0
steps:
  - do: none
    expect: shell test "$(id -un)" = karan
    note: otomatik giriş canlı kullanıcıya
  - do: none
    expect: shell test -n "$DISPLAY"
  - do: none
    expect: shell test "$(ls -d /users/karan/*/ | wc -l)" -ge 6
    note: 6 kullanıcı klasörü (USERS-OK ile aynı)
  - do: none
    expect: shell grep -q "timeout_style=hidden" /run/live/medium/boot/grub/config.cfg
    note: B1 — GRUB menüsü gizli
  - do: none
    expect: shell grep -q "^Theme=kavis" /etc/plymouth/plymouthd.conf
    note: splash teması (plymouth-set-default-theme kullanıcı olarak çalışmıyor)
  - do: none
    expect: shell grep -q DESKTOP-READY /run/kavis/boot-check.log
    note: boot-check DESKTOP-READY yazdı (journal kullanıcıya kapalı; boot-check /run/kavis/boot-check.log'a da yazar — test2 ISO'sunda bu dosya yok, düşer)
  - do: none
    expect: process kavis-panel running
  - do: none
    expect: process kavis-snap running
  - do: none
    expect: process picom running
  - do: none
    expect: window kavis-panel visible
    shot: true
