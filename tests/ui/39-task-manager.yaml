# Task Manager (items 39/7): open, tabs, close
name: 39-task-manager
title: Task Manager
item: 39
allowed: [kavis-tools]
steps:
  - do: launch kavis-tools tasks
    expect: window kavis-tools visible
    timeout: 40000
    shot: true
  - do: wait 1500
    expect: window kavis-tools focused
    timeout: 5000
  - do: none
    expect: process kavis-tools running
  - do: key ctrl+f
    expect: ok
    note: search box (if any) — no expectation, only the anomaly scan
  - do: close window kavis-tools
    expect: window kavis-tools absent
    timeout: 8000
