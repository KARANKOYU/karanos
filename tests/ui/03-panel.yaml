# Panel (items 3/60): Start open/close (click + Win + Ctrl+Esc), calendar, outside click
name: 03-panel
title: Taskbar and Start
item: 3
allowed: [nemo, tilix, firefox]
steps:
  - do: click taskbar start
    expect: popup kavis-panel visible
    timeout: 8000
    note: Start button opens the menu
    shot: true
  - do: key Escape
    expect: popup kavis-panel hidden
    timeout: 4000
  - do: key super
    expect: popup kavis-panel visible
    timeout: 8000
    note: Win key (xcape → XF86Launch5)
  - do: key super
    expect: popup kavis-panel hidden
    timeout: 4000
    note: second Win closes it (C2 toggle)
  - do: key ctrl+Escape
    expect: popup kavis-panel visible
    timeout: 8000
  - do: click 640 300
    expect: popup kavis-panel hidden
    timeout: 4000
    note: clicking outside closes it (item 60)
  - do: click taskbar clock
    expect: popup kavis-panel visible
    timeout: 8000
    note: clock → calendar
    shot: true
  - do: key Escape
    expect: popup kavis-panel hidden
    timeout: 4000
