# Lock screen (item 70).
#
# The live account has no password — since 11 Sep 2026 really: live-config
# gives its user the password "live" and 0031-kavis-dirs deletes it at
# boot — and since the v0.5-test1 report the rule is that such an account
# is NOT locked: the screen could only ever be opened by pressing Enter,
# and getting the question wrong in the other direction leaves somebody
# shut out of their own machine with no way back. So what this scenario
# asserts in a live session is that Win+L explains itself and leaves the
# desktop alone.
#
# The password path cannot be exercised here — there is no password to
# type. It stays on the VM checklist, together with the escape hatch
# (three refusals inside thirty seconds reveal Log out), which by
# definition only appears when a password exists and is being refused.
name: 70-lock-screen
title: Lock screen
item: 70
allowed: [kavis-lock]
steps:
  - do: shell id -nG | tr ' ' '\n' | grep -qx nopasswdlogin
    expect: ok
    note: >
      THE ROOT CAUSE, asserted first. /etc/pam.d/kavis-lock begins with
      `pam_succeed_if.so user ingroup nopasswdlogin`, so on an account
      with no password that group membership is the only thing any
      answer can succeed through — common-auth below it is pam_unix,
      which refuses an empty password. The boot parameter asks
      live-config for the group, and if the group did not exist yet
      when user-setup ran the request is dropped silently. That is how
      v0.5-test1 shipped a lock screen that said "Wrong password" to
      everything. 0031-kavis-dirs now makes it true rather than hoping,
      and boot-check fails the run without it.
  - do: shell if sudo -n true 2>/dev/null; then test -z "$(sudo -n getent shadow "$USER" | cut -d':' -f2)"; fi
    expect: ok
    note: >
      THE OTHER HALF of the root cause: the account really has no
      password hash. live-config's user-setup gives the live user the
      password "live" — that is what v0.5-test1's lock was asking for,
      and nothing on screen said so. 0031-kavis-dirs deletes it; this
      reads /etc/shadow through the live session's passwordless sudo
      to prove it (and is a no-op where sudo asks for a password, i.e.
      on an installed system, where a hash is right).
  - do: launch kavis-lock
    expect: window kavis-lock visible
    timeout: 20000
    note: >
      the notice, not the locker: this account has no password, so
      kavis-lock says so instead of asking for one
    shot: true
  - do: key ctrl+Escape
    expect: popup kavis-panel visible
    timeout: 6000
    note: >
      THE POINT OF THE WHOLE ITEM: the session is not grabbed. The Start
      menu still opens with the notice on screen, which is what "the
      user is not locked out" means in a step
  - do: key Escape
    expect: popup kavis-panel hidden
    timeout: 4000
  - do: wait 12000
    expect: window kavis-lock absent
    timeout: 20000
    note: the notice goes away by itself; nothing is left covering the screen
    shot: true
  - do: shell test -f /etc/pam.d/kavis-lock
    expect: ok
    note: >
      the PAM stack is still what decides on a machine that DOES have a
      password — and it is now what decides whether one exists at all,
      instead of group membership guessing at it
