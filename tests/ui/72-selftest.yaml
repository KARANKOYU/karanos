# The selftest itself (item 72).
#
# A scenario about the machinery running it: the binary, the scenarios
# it reads, and the report directory it writes. It cannot run the whole
# suite from inside the suite, so what it checks is that a second run
# would find everything it needs.
name: 72-selftest
title: Selftest
item: 72
allowed: []
steps:
  - do: shell command -v kavis-selftest
    expect: ok
  - do: shell test -d /usr/share/kavis/selftest
    expect: ok
    note: the scenarios ship with the binary
  - do: shell test "$(ls /usr/share/kavis/selftest/*.yaml | wc -l)" -ge 20
    expect: ok
    note: every finished task item has one (docs/test-kapsami.md)
  - do: shell test -d /users/karan/.local/share/kavis/selftest
    expect: ok
    note: this run's own report directory
  - do: shell test -z "$(grep -rl kavis-selftest /etc/xdg/autostart /usr/lib/systemd/system /etc/systemd/system 2>/dev/null)"
    expect: ok
  - do: shell grep -q 'ci_run=0' /usr/lib/kavis/boot-check
    expect: ok
    note: >
      and boot-check asks the same question before ANY measurement that
      opens a window. It used to start Settings on every live boot to
      weigh it — the VM round reported that as "Settings opens and
      closes on its own at startup", which is exactly what it looked
      like. A diagnostic that a person can see is not a diagnostic.
    note: >
      B2: the scenarios ship, the TRIGGER does not. Nothing may start
      the selftest on its own — no autostart entry, no unit, no timer.
      The v0.5-test1 VM round found it running on every live boot,
      pressing keys and dragging windows while somebody was trying to
      use the machine for the first time. Asserted structurally rather
      than by watching a boot, because a boot that happens not to
      trigger it proves nothing about the next one.
