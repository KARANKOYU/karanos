# Printer wizard (item 43): the driverless path is in place.
#
# No printer exists in a VM, so what is checked is the machinery that
# makes one appear by itself — cups answering, avahi for discovery, and
# the wizard for the rest. cups is socket-activated, so it is asked a
# question rather than asked whether it is running.
name: 43-printer
title: Printing
item: 43
allowed: []
steps:
  - do: shell lpstat -r
    expect: ok
    timeout: 20000
    note: the scheduler answers
  - do: shell systemctl is-active --quiet avahi-daemon || systemctl is-enabled --quiet avahi-daemon
    expect: ok
    timeout: 15000
    note: network printers announce themselves over mDNS
  - do: shell command -v system-config-printer
    expect: ok
